<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NORCET Prelims - Cardiovascular Apex Simulator (100 Qs)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            line-height: 1.6; 
            padding: 20px; 
        }
        
        .container { 
            max-width: 1100px; 
            width: 100%; 
        }
        
        /* HEADER & DASHBOARD */
        .header { 
            background: #1e293b; 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 15px 40px rgba(225, 29, 72, 0.15); 
            margin-bottom: 30px; 
            text-align: center; 
            border-top: 6px solid #e11d48; 
            border-bottom: 1px solid #334155; 
        }
        .header h1 { margin: 0 0 10px 0; font-size: 2.6em; color: #fb7185; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; }
        .header p { margin: 0; color: #94a3b8; font-size: 1.15em; font-weight: 500; }
        
        .dashboard { display: flex; justify-content: space-between; margin-top: 25px; padding-top: 20px; border-top: 1px solid #334155; font-weight: 700; font-size: 1.4em; color: #e2e8f0; align-items: center; }
        .score-box { color: #f43f5e; background: rgba(225, 29, 72, 0.1); padding: 8px 20px; border-radius: 8px; border: 1px solid rgba(225, 29, 72, 0.2); }
        
        /* QUESTION AREA */
        .question-container { background: #1e293b; padding: 45px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: none; margin-bottom: 20px; border: 1px solid #334155; }
        .question-container.active { display: block; animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .subject-tag { display: inline-block; padding: 6px 18px; background: #0f172a; color: #fda4af; font-size: 0.9em; border-radius: 20px; margin-bottom: 25px; font-weight: 800; border: 1px solid #e11d48; text-transform: uppercase; letter-spacing: 1px; }
        .q-text { font-size: 1.4em; font-weight: 700; margin-bottom: 35px; color: #f8fafc; line-height: 1.6; }
        
        /* OPTIONS */
        .options { display: flex; flex-direction: column; gap: 16px; }
        .option-btn { background: #0f172a; border: 2px solid #334155; padding: 22px; border-radius: 12px; text-align: left; font-size: 1.15em; cursor: pointer; transition: all 0.2s; color: #cbd5e1; font-weight: 500; line-height: 1.5; }
        
        @media (hover: hover) {
            .option-btn:hover:not(.disabled) { background: #334155; border-color: #f43f5e; transform: translateX(6px); }
            .nav-btn:hover:not(:disabled) { background: #be123c; box-shadow: 0 5px 15px rgba(225, 29, 72, 0.4); transform: translateY(-2px); }
        }

        .option-btn.correct { background: #064e3b; border-color: #10b981; color: #a7f3d0; font-weight: 700; box-shadow: 0 0 20px rgba(16, 185, 129, 0.25); }
        .option-btn.incorrect { background: #7f1d1d; border-color: #ef4444; color: #fecaca; box-shadow: 0 0 20px rgba(239, 68, 68, 0.25); }
        .option-btn.disabled { pointer-events: none; }
        
        /* RATIONALE */
        .rationale { margin-top: 35px; padding: 25px; background: rgba(225, 29, 72, 0.05); border-left: 6px solid #e11d48; border-radius: 0 12px 12px 0; display: none; font-size: 1.15em; color: #ffe4e6; animation: fadeIn 0.6s; line-height: 1.7; border: 1px solid rgba(225, 29, 72, 0.2); }
        .rationale strong { color: #fb7185; font-size: 1.2em; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 15px; border-bottom: 1px solid rgba(225, 29, 72, 0.3); padding-bottom: 8px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* NAVIGATION & PROGRESS */
        .navigation { display: flex; justify-content: space-between; margin-top: 40px; gap: 15px; }
        .nav-btn { flex: 1; background: #e11d48; color: #fff; border: none; padding: 18px; border-radius: 10px; font-size: 1.2em; cursor: pointer; transition: 0.3s; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        .nav-btn:disabled { background: #334155; cursor: not-allowed; color: #64748b; }
        
        .progress-bar { width: 100%; background: #334155; height: 16px; border-radius: 8px; margin-bottom: 35px; overflow: hidden; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #be123c, #fb7185); width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* RESULTS SCREEN */
        #results-screen { display: none; background: #1e293b; padding: 60px 20px; border-radius: 16px; text-align: center; border: 1px solid #334155; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .final-score { font-size: 5.5em; color: #fb7185; font-weight: 900; margin: 30px 0; text-shadow: 0 0 30px rgba(225, 29, 72, 0.3); }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .header { padding: 25px 15px; margin-bottom: 20px; }
            .header h1 { font-size: 1.8em; }
            .header p { font-size: 1em; }
            .dashboard { flex-direction: column; gap: 15px; font-size: 1.1em; }
            .score-box { width: 100%; text-align: center; }
            .question-container { padding: 25px 20px; margin-bottom: 15px; }
            .subject-tag { font-size: 0.8em; padding: 5px 12px; margin-bottom: 15px; }
            .q-text { font-size: 1.15em; margin-bottom: 25px; }
            .options { gap: 12px; }
            .option-btn { padding: 16px; font-size: 1em; }
            .rationale { padding: 15px; font-size: 1em; margin-top: 25px; }
            .rationale strong { font-size: 1.1em; }
            .navigation { margin-top: 25px; }
            .nav-btn { padding: 15px; font-size: 1em; }
            #results-screen { padding: 40px 15px; }
            .final-score { font-size: 4em; }
        }
        @media (max-width: 480px) {
            .header h1 { font-size: 1.5em; line-height: 1.3; }
            .q-text { font-size: 1.05em; }
            .navigation { flex-direction: column-reverse; gap: 10px; }
            .nav-btn { width: 100%; font-size: 0.95em; padding: 14px; }
            .option-btn { padding: 14px; font-size: 0.95em; }
            .final-score { font-size: 3em; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Cardiovascular Masterclass</h1>
        <p>100 High-Level NORCET Scenarios | Auto-Rationales</p>
        <div class="dashboard">
            <span id="q-counter">Question: 1 / 100</span>
            <span class="score-box">Marks: <span id="score">0.00</span></span>
        </div>
    </div>
    
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div id="quiz-body"></div>

    <div id="results-screen">
        <h2>Simulation Concluded</h2>
        <div class="final-score" id="final-score-display">0.00 / 100</div>
        <p style="font-size:1.1em; color:#cbd5e1; margin-bottom: 20px;">Review every rationale. Clinical mastery requires absolute precision.</p>
        <button class="nav-btn" onclick="location.reload()">Attempt Again</button>

<script>
// EXACTLY 100 HIGH-DIFFICULTY CARDIOVASCULAR QUESTIONS
const questions = [
    { q: "A 68-year-old male presents with a crushing substernal chest pain. The 12-lead ECG reveals ST-segment elevation in leads II, III, and aVF. BP is 85/50 mmHg, HR 52 bpm, and lung sounds are clear. What is the absolute MOST dangerous intervention the nurse could perform?", o: ["Administering a 500 mL normal saline bolus", "Administering sublingual Nitroglycerin", "Administering Aspirin 325 mg chewed", "Obtaining a right-sided ECG (V4R)"], a: 1, t: "ACS / Pharmacology", e: "ST elevation in II, III, and aVF indicates an Inferior Wall MI, which frequently involves the Right Ventricle. An RV infarction destroys the right heart's pumping ability, making it totally dependent on preload (venous return). Nitroglycerin is a potent venodilator. Giving Nitro instantly destroys preload, causing catastrophic, fatal hypotension. They need IV fluids, not Nitro." },
    { q: "A patient with severe heart failure is admitted to the ICU. Hemodynamic monitoring via a Swan-Ganz catheter reveals a CVP of 18 mmHg, a PAWP of 24 mmHg, and a Cardiac Index of 1.6 L/min/m2. What is the defining state of this patient?", o: ["Right-sided heart failure only (Cor Pulmonale)", "Hypovolemic Shock", "Biventricular failure leading to Cardiogenic Shock", "Septic Shock"], a: 2, t: "Hemodynamics", e: "Normal CVP is 2-8 (18 indicates right-sided failure). Normal PAWP is 6-12 (24 indicates profound left-sided failure). A Cardiac Index < 2.2 confirms severe pump failure (Cardiogenic Shock). This is catastrophic biventricular failure." },
    { q: "A patient with an intra-aortic balloon pump (IABP) develops a sudden drop in radial pulse on the left arm, decreased urine output (10 mL/hr), and absent bowel sounds. What complication should the nurse immediately suspect?", o: ["Balloon rupture causing helium embolus", "Upward or downward migration of the balloon catheter", "Infection at the femoral insertion site", "Aortic dissection"], a: 1, t: "Hemodynamics / Devices", e: "If the IABP catheter migrates UPWARD, it blocks the left subclavian artery (loss of left radial pulse). If it migrates DOWNWARD, it blocks the renal and mesenteric arteries (oliguria/ischemia). The nurse must stop pumping and notify the provider to confirm placement." },
    { q: "A patient on telemetry suddenly shows polymorphic ventricular tachycardia with a shifting axis (Torsades de Pointes). The patient is awake but dizzy, with a BP of 100/60. What is the first-line pharmacological treatment?", o: ["IV Amiodarone 150 mg", "IV Magnesium Sulfate 1-2 grams", "IV Lidocaine 1 mg/kg", "Synchronized Cardioversion"], a: 1, t: "Arrhythmias", e: "Torsades de Pointes is caused by a prolonged QT interval (often hypomagnesemia). The definitive first-line treatment for a hemodynamically stable patient is IV Magnesium Sulfate to stabilize the cardiac membrane. Unstable patients require unsynchronized defibrillation." },
    { q: "A patient is 6 hours post-op from a CABG. The mediastinal chest tubes have been draining 100 mL/hr. Suddenly, the drainage stops completely. Thirty minutes later, BP drops to 80/50, heart sounds are distant, and CVP spikes to 20 mmHg. Diagnosis?", o: ["Tension Pneumothorax", "Hypovolemic Shock due to internal bleeding", "Cardiac Tamponade", "Acute Myocardial Infarction"], a: 2, t: "Post-Op Cardiac", e: "Sudden cessation of chest tube drainage post-cardiac surgery suggests a clot. Blood accumulates in the pericardium, causing Cardiac Tamponade. Classic signs are Beck's Triad: severe hypotension, elevated CVP (JVD), and muffled heart sounds. Requires immediate exploration." },
    { q: "A patient with chronic A-Fib takes Warfarin. The patient presents with severe epistaxis and hematuria. The INR is 6.5. Which order should the nurse anticipate immediately?", o: ["Administer Protamine Sulfate", "Administer Vitamin K and Fresh Frozen Plasma (FFP)", "Administer IV Heparin bridge therapy", "Administer Aminocaproic Acid"], a: 1, t: "Cardiac Pharmacology", e: "An INR of 6.5 with active bleeding is a life-threatening emergency. Warfarin toxicity is treated with Vitamin K. Because Vitamin K takes hours to work, Fresh Frozen Plasma (FFP) must be given simultaneously to provide instant clotting factors to stop the bleeding." },
    { q: "During a code blue, a patient is in Ventricular Fibrillation. The team has performed CPR, defibrillated twice, and given 1 mg of Epinephrine. The rhythm remains V-Fib. What is the next drug?", o: ["Atropine 1 mg", "Amiodarone 300 mg", "Lidocaine 1.5 mg/kg", "Epinephrine 1 mg"], a: 1, t: "ACLS Protocol", e: "According to the ACLS algorithm for refractory V-Fib/Pulseless V-Tach, after the 2nd shock and 1st dose of Epinephrine, the next step is an antiarrhythmic. Amiodarone 300 mg IV push is the first-line drug of choice." },
    { q: "A patient is admitted with Acute Pericarditis. Which classic ECG finding is the hallmark of this condition?", o: ["ST elevation in V1-V4 with reciprocal depression", "Widespread, diffuse ST-segment elevation across almost all leads and PR-segment depression", "Peaked T waves and widened QRS complexes", "Prolonged PR interval and narrow QRS"], a: 1, t: "ECG Interpretation", e: "Unlike an MI (localized ST elevation with reciprocal depression), Acute Pericarditis causes diffuse, global inflammation of the pericardial sac, resulting in widespread ST elevation in almost all leads, classically accompanied by PR segment depression." },
    { q: "A patient with heart failure takes Digoxin and Furosemide. The patient complains of seeing 'yellow-green halos'. Which laboratory finding most strongly exacerbates this toxicity?", o: ["Serum Sodium 130 mEq/L", "Serum Potassium 2.8 mEq/L", "Serum Calcium 10.5 mg/dL", "Serum Magnesium 2.0 mEq/L"], a: 1, t: "Cardiac Pharmacology", e: "Digoxin binds to the Na+/K+ ATPase pump. Potassium competes for these sites. If hypokalemic (K+ 2.8, caused by Furosemide), there is no potassium to compete, allowing massive amounts of Digoxin to bind to the heart, causing profound, lethal toxicity." },
    { q: "A patient with an Abdominal Aortic Aneurysm (AAA) complains of a severe, tearing pain in the lower back. Blood pressure drops to 70/40 mmHg, and the patient becomes tachycardic. What has occurred?", o: ["The aneurysm is enlarging slowly", "Aortic Dissection in the thoracic cavity", "Rupture of the Abdominal Aortic Aneurysm", "Acute Mesenteric Ischemia"], a: 2, t: "Vascular Emergencies", e: "Sudden, excruciating, 'tearing' back pain accompanied by profound hypovolemic shock (BP 70/40, tachycardia) is the classic triad of a ruptured AAA. The aorta has burst into the retroperitoneal space. This is a catastrophic surgical emergency." },
    { q: "A patient presents with a hypertensive emergency (BP 240/130). The provider orders an IV infusion of Sodium Nitroprusside. The nurse protects the IV bag with an opaque sleeve. What is the rationale?", o: ["To prevent precipitation with saline", "To prevent light exposure, which degrades the drug into deadly cyanide", "To maintain the temperature", "To prevent binding to the plastic tubing"], a: 1, t: "Cardiac Pharmacology", e: "Sodium Nitroprusside is extremely photosensitive. Light exposure rapidly degrades the molecule, rendering it ineffective and releasing toxic cyanide ions. The bag and tubing must be covered with an opaque sleeve immediately." },
    { q: "The nurse auscultates a harsh, crescendo-decrescendo systolic murmur loudest at the 2nd right intercostal space, radiating directly to the carotid arteries. What valvular defect does this indicate?", o: ["Mitral Regurgitation", "Aortic Stenosis", "Mitral Stenosis", "Aortic Regurgitation"], a: 1, t: "Valvular Disease", e: "The aortic valve is at the 2nd right intercostal space. A systolic, harsh, crescendo-decrescendo murmur here that physically radiates up into the neck (carotids) is the classic pathognomonic presentation of Aortic Stenosis." },
    { q: "A patient in the ICU has a CVP line. Which condition would directly cause a falsely ELEVATED CVP reading?", o: ["Hypovolemia from severe hemorrhage", "Mechanical ventilation with high Positive End-Expiratory Pressure (PEEP)", "Massive systemic vasodilation from sepsis", "Administration of high-dose Nitroglycerin"], a: 1, t: "Hemodynamics", e: "CVP measures right atrial pressure. High PEEP pushes immense pressure into the thoracic cavity. This positive intrathoracic pressure compresses the right atrium from the outside, artificially squeezing it and causing a falsely elevated CVP reading." },
    { q: "A patient with Infective Endocarditis has small, painful, red, raised nodules on the pads of the fingers and toes. How should the nurse document this finding?", o: ["Janeway lesions", "Osler's nodes", "Roth's spots", "Splinter hemorrhages"], a: 1, t: "Cardiac Infections", e: "Osler's nodes are painful, raised nodules on finger/toe pads caused by immune complex deposition. Janeway lesions are painless, flat, red spots on palms/soles caused by microemboli. Roth's spots are retinal hemorrhages." },
    { q: "A patient with a history of severe Asthma is prescribed a new medication for Angina. Which class of antianginal medication is strictly CONTRAINDICATED?", o: ["Calcium Channel Blockers", "Nitrates", "Non-selective Beta-Blockers", "Antiplatelets"], a: 2, t: "Cardiac Pharmacology", e: "Non-selective beta-blockers (Propranolol, Nadolol) block both Beta-1 (heart) and Beta-2 (lungs) receptors. Blocking Beta-2 causes severe, fatal bronchoconstriction in asthmatics. Only cardioselective (Beta-1) blockers should be considered." },
    { q: "A patient with acute decompensated heart failure receives IV Nesiritide (Natrecor). What is its exact mechanism of action?", o: ["It massively increases the force of myocardial contraction", "It promotes massive diuresis, natriuresis, and potent vasodilation to reduce preload and afterload", "It dissolves clots in the coronary arteries", "It blocks the RAAS system"], a: 1, t: "Cardiac Pharmacology", e: "Nesiritide is recombinant BNP. It acts exactly like natural BNP: forcing the kidneys to excrete sodium and water (diuresis/natriuresis) and acting as a potent smooth muscle relaxant (vasodilator), drastically lowering both preload and afterload." },
    { q: "A patient's ECG shows completely absent P waves, a chaotic fibrillatory baseline, and totally irregular R-R intervals with a ventricular rate of 140 bpm. What is this rhythm?", o: ["Ventricular Fibrillation", "Atrial Flutter", "Atrial Fibrillation with Rapid Ventricular Response (RVR)", "Supraventricular Tachycardia (SVT)"], a: 2, t: "ECG Interpretation", e: "An 'irregularly irregular' rhythm with absent P waves and a chaotic baseline is Atrial Fibrillation. Because the ventricular rate is >100 bpm, it is specifically termed A-Fib with RVR." },
    { q: "A patient with an acute Aortic Dissection has a BP of 220/120 and HR of 115. What is the absolute FIRST pharmacological priority?", o: ["Administer IV Nitroprusside", "Administer IV Esmolol (Beta-blocker)", "Administer IV Morphine", "Administer IV Heparin"], a: 1, t: "Vascular Emergencies", e: "In aortic dissection, the sheer force of contraction (dP/dt) tears the aorta further. The absolute priority is an IV Beta-Blocker FIRST to blunt heart rate and force. Giving a vasodilator first causes reflex tachycardia, which will completely rupture the aorta." },
    { q: "A patient collapses pulseless. The defibrillator shows Asystole. What is the nurse's immediate action?", o: ["Defibrillate at 200 Joules", "Initiate high-quality CPR and prepare Epinephrine 1 mg IV", "Administer Atropine 1 mg IV", "Perform synchronized cardioversion"], a: 1, t: "ACLS Protocol", e: "Asystole is a NON-SHOCKABLE rhythm. Defibrillation is strictly contraindicated. The only treatment is immediate, high-quality CPR and Epinephrine 1 mg every 3-5 minutes. Atropine is no longer in the ACLS Asystole algorithm." },
    { q: "A patient is prescribed Amiodarone. Which severe, life-threatening long-term side effect must the patient monitor for?", o: ["Tardive Dyskinesia", "Pulmonary Fibrosis (new onset cough, dyspnea)", "Acute Renal Failure", "Gastrointestinal Bleeding"], a: 1, t: "Cardiac Pharmacology", e: "Amiodarone is highly lipophilic and accumulates in tissues. The most severe long-term side effect is Amiodarone-induced Pulmonary Toxicity, leading to irreversible Pulmonary Fibrosis. Any new dry cough or dyspnea requires immediate evaluation." },
    { q: "An Echocardiogram reports an Ejection Fraction (EF) of 25%. How should the nurse interpret this?", o: ["Normal heart function", "Mild heart failure", "Severe systolic heart failure (HFrEF)", "Severe diastolic heart failure (HFpEF)"], a: 2, t: "Heart Failure", e: "Normal EF is 55-70%. An EF of 25% indicates severe failure of the left ventricle to pump blood out during contraction (systole). This is defined as Severe Systolic Heart Failure (Heart Failure with Reduced Ejection Fraction - HFrEF)." },
    { q: "A patient with suspected PE has a severe iodine allergy. Which alternative diagnostic test is the gold standard for diagnosing a PE in this patient?", o: ["D-Dimer blood test", "Ventilation-Perfusion (V/Q) Scan", "Echocardiogram", "Lower extremity doppler"], a: 1, t: "Diagnostics", e: "A CT Angiogram requires iodine contrast. If allergic, the diagnostic alternative of choice is the Ventilation/Perfusion (V/Q) scan. It uses radioisotopes to find areas of the lung that are ventilated but lack perfusion (a V/Q mismatch), diagnosing the PE." },
    { q: "A temporary transvenous pacemaker shows a pacing spike NOT followed by a QRS complex. Intrinsic HR is 35. What is the malfunction and intervention?", o: ["Failure to sense; turn on left side", "Failure to capture; increase the output (mA) until a QRS is seen", "Failure to pace; check battery", "Oversensing; decrease sensitivity"], a: 1, t: "Pacemakers", e: "When a pacing spike fails to depolarize the heart (no QRS), it is 'Failure to Capture'. The electrical current isn't strong enough. The immediate life-saving intervention is to increase the electrical output (mA) until every spike results in a QRS." },
    { q: "A patient has Acute Pericarditis. What classic auscultatory finding confirms this, and how is it best heard?", o: ["S3 gallop at the apex", "Harsh systolic murmur at right sternal border", "A scratchy, grating Pericardial Friction Rub heard best at the lower left sternal border leaning forward", "A continuous machine-like murmur"], a: 2, t: "Cardiac Assessment", e: "The hallmark of acute pericarditis is a Pericardial Friction Rub (inflamed layers rubbing). It sounds like leathery, scratchy grating, heard best with the diaphragm at the lower left sternal border when the patient sits up, leans forward, and exhales." },
    { q: "A patient taking Lisinopril presents with massive swelling of the lips, tongue, and face, and stridor. What is the pathophysiology?", o: ["Anaphylaxis (IgE-mediated)", "Accumulation of Bradykinin leading to massive vasodilation and increased capillary permeability (Angioedema)", "Direct laryngeal nerve toxicity", "Buildup of Angiotensin II"], a: 1, t: "Cardiac Pharmacology", e: "ACE inhibitors block ACE, which also breaks down Bradykinin. When ACE is blocked, Bradykinin builds up massively. It is a potent vasodilator that increases capillary permeability, leaking fluid into the face/throat (Angioedema), causing a fatal airway emergency." },
    { q: "What is the explicit mechanism of action of Clopidogrel (Plavix)?", o: ["Dissolves existing clots", "Irreversibly blocks P2Y12 ADP receptors on platelets, preventing aggregation", "Inhibits Vitamin K-dependent clotting factors", "Binds to antithrombin III"], a: 1, t: "Cardiac Pharmacology", e: "Clopidogrel is an antiplatelet (thienopyridine). It permanently binds to the P2Y12 ADP receptors on platelets, preventing them from receiving the signal to become sticky and clump together (aggregation), thus preventing stent thrombosis." },
    { q: "A patient with HR 32 bpm is given IV Atropine, but there is no response. BP is 75/40. According to ACLS, what is the NEXT immediate intervention?", o: ["Epinephrine 1 mg IV push", "Prepare for Transcutaneous Pacing (TCP) or dopamine/epi infusion", "Administer IV Amiodarone", "Unsynchronized Defibrillation"], a: 1, t: "ACLS Protocol", e: "For unstable bradycardia refractory to Atropine (or if Atropine is ineffective like in 3rd degree block), the next step is Transcutaneous Pacing (TCP) or initiating a continuous infusion of a chronotropic drug (Dopamine/Epi). Epi IV push is for cardiac arrest." },
    { q: "A patient with right-sided infective endocarditis (Tricuspid) must be monitored for which specific embolic complication?", o: ["Ischemic Stroke", "Myocardial Infarction", "Pulmonary Embolism (PE)", "Renal infarction"], a: 2, t: "Cardiac Patho", e: "The tricuspid valve is on the right side. If vegetations break off, they travel directly out the pulmonary artery and lodge strictly in the lungs, causing Pulmonary Embolisms. Left-sided endocarditis causes systemic emboli (strokes)." },
    { q: "What is the precise, primary intended effect of a Dobutamine infusion?", o: ["Potent peripheral vasodilation", "Decreasing heart rate", "Strong Beta-1 agonism leading to a massive increase in myocardial contractility (Positive Inotrope)", "Suppression of arrhythmias"], a: 2, t: "Cardiac Pharmacology", e: "Dobutamine is a highly selective Beta-1 agonist. Its primary action is to drastically increase the force of myocardial contraction (positive inotrope), increasing stroke volume and cardiac output in severe heart failure or cardiogenic shock." },
    { q: "An ECG shows a QRS of 0.16 seconds and an 'RSR' (rabbit ear) pattern in leads V1 and V2. Diagnosis?", o: ["LBBB", "Right Bundle Branch Block (RBBB)", "Third-Degree AV Block", "WPW Syndrome"], a: 1, t: "ECG Interpretation", e: "QRS > 0.12s indicates a bundle branch block. The 'RSR' (rabbit ear) pattern in the right precordial leads (V1/V2) is the absolute hallmark of a Right Bundle Branch Block (RBBB). LBBB shows broad R waves in V6." },
    { q: "Which physical assessment maneuver for DVT is historically associated with the condition but is now considered DANGEROUS and strongly discouraged?", o: ["Checking pedal pulses", "Homan's sign (forceful dorsiflexion of the foot)", "Measuring calf circumference", "Palpating femoral artery"], a: 1, t: "Assessment", e: "Homan's sign involves forcefully dorsiflexing the foot, which physically squeezes the calf muscles against the deep veins, potentially breaking a clot loose and instantly causing a fatal Pulmonary Embolism. It is explicitly contraindicated." },
    { q: "Why is Spironolactone (Aldactone) used in severe heart failure instead of just Furosemide?", o: ["It is a faster diuretic", "It blocks Aldosterone, preventing cardiac remodeling/fibrosis and retaining potassium", "It directly increases pumping force", "It dissolves lung fluid"], a: 1, t: "Cardiac Pharmacology", e: "Spironolactone is a Potassium-Sparing Diuretic that specifically blocks Aldosterone. In heart failure, massive aldosterone release causes severe cardiac fibrosis and remodeling. Blocking it drastically improves long-term survival by stopping structural damage." },
    { q: "A patient with Acute Arterial Occlusion of the right leg is assessed using the '6 Ps'. Which is NOT one of the 6 Ps?", o: ["Pain", "Pallor", "Pulselessness", "Purpura"], a: 3, t: "Vascular Assessment", e: "The 6 P's of acute arterial occlusion are Pain, Pallor, Pulselessness, Paresthesia, Paralysis, and Poikilothermia (coolness). Purpura (purple bleeding spots) is not one of them." },
    { q: "A temporary transvenous pacemaker shows a spike perfectly followed by a wide QRS, but the patient's BP is 60/40 and they have no pulse. Diagnosis?", o: ["Failure to Capture", "Pulseless Electrical Activity (PEA)", "Failure to Sense", "V-Tach"], a: 1, t: "ACLS Protocol", e: "The pacemaker is working perfectly electrically (spike + QRS = 100% capture). However, the heart MUSCLE is too damaged or empty to physically contract. Organized electrical activity without a pulse is PEA. Immediate CPR is required." },
    { q: "A patient on Clonidine (Catapres) is discharged. Which instruction is crucial?", o: ["Take with grapefruit juice", "Never stop this medication abruptly, as it will cause a deadly rebound hypertensive crisis", "It turns urine orange", "Check WBCs weekly"], a: 1, t: "Cardiac Pharmacology", e: "Clonidine is a central alpha-2 agonist that suppresses sympathetic outflow. If stopped abruptly, the brain unleashes a massive surge of catecholamines, causing a terrifying, life-threatening rebound hypertensive crisis. Tapering is mandatory." },
    { q: "A patient with STEMI receives tPA. Which clinical finding is the BEST indicator that reperfusion therapy was SUCCESSFUL?", o: ["Heart rate drops to 60", "ST-segment elevation completely resolves to baseline and chest pain disappears", "Development of continuous V-Tach", "Troponin instantly normalizes"], a: 1, t: "ACS", e: "The absolute best clinical markers of successful tPA reperfusion are the abrupt cessation of chest pain and the rapid, complete resolution of the ST-segment elevation on the ECG. (Transient PVCs are also normal reperfusion arrhythmias)." },
    { q: "The exact pathophysiology of Dilated Cardiomyopathy involves:", o: ["Massive thickening of ventricular walls", "Replacement of muscle with stiff scar tissue", "Profound dilation and thinning of the ventricles, leading to a weak, floppy heart and severe systolic dysfunction", "Pericardial inflammation"], a: 2, t: "Cardiomyopathy", e: "In Dilated Cardiomyopathy, the heart chambers balloon out, and walls become incredibly thin and stretched. This leads to massive failure of contractility (systolic dysfunction/HFrEF) because the floppy muscle cannot squeeze blood out effectively." },
    { q: "Mitral Stenosis places the patient at high risk for which specific complication due to altered hemodynamics?", o: ["Aortic Aneurysm", "Right Ventricular Hypertrophy and Pulmonary Hypertension", "Left Ventricular Hypertrophy", "Systemic Embolism"], a: 1, t: "Valvular Disease", e: "Mitral stenosis blocks blood flow from the left atrium to the left ventricle. Blood backs up into the left atrium, then pulmonary veins, and lungs, causing Pulmonary Hypertension. The right ventricle must pump against this lung pressure, leading to Right Ventricular Hypertrophy (Cor Pulmonale)." },
    { q: "A patient on a continuous Heparin infusion has an aPTT of 180 seconds and is bleeding heavily from gums. Immediate action sequence?", o: ["Administer Vitamin K, stop Heparin", "Stop Heparin infusion, notify provider, and prepare Protamine Sulfate", "Decrease Heparin rate by half", "Administer FFP"], a: 1, t: "Cardiac Pharmacology", e: "The aPTT is dangerously high (therapeutic is 1.5-2.5x control, ~45-75 sec). At 180 seconds with active bleeding, the patient is highly toxic. Stop the infusion immediately. The direct, specific antidote for Heparin is Protamine Sulfate." },
    { q: "Which instruction is absolutely CONTRAINDICATED for a patient with Peripheral Arterial Disease (PAD)?", o: ["Keep legs dependent to improve flow", "Apply heating pads directly to calves at night to increase circulation", "Stop smoking", "Walk until it hurts, rest, walk again"], a: 1, t: "PVD", e: "PAD causes severe ischemia and numbness. Applying direct heat is absolutely contraindicated because the patient lacks sensation and will easily suffer severe third-degree burns. Heat also increases the metabolic demand of tissues already starved of oxygen." },
    { q: "30 minutes post-coronary angiogram via right femoral artery, the patient complains of sudden, severe right flank/back pain. BP drops to 85/50. Femoral site looks clean. What is the hidden catastrophe?", o: ["Acute Renal Failure", "Retroperitoneal Hemorrhage", "Aortic Dissection", "Vagal Response"], a: 1, t: "Post-Cath Complications", e: "If the femoral puncture leaks internally, blood tracks up into the retroperitoneal space (invisible from outside). Classic signs are sudden severe back/flank pain and hypovolemic shock. This is a life-threatening emergency requiring manual pressure above the site and surgery." },
    { q: "An ECG shows P waves and QRS complexes completely dissociated; they beat at their own separate rates. Diagnosis?", o: ["First-Degree Block", "Wenckebach", "Mobitz II", "Third-Degree (Complete) AV Block"], a: 3, t: "ECG Interpretation", e: "In a Third-Degree AV Block, the electrical connection is completely severed. The atria and ventricles fire completely independently of each other (AV Dissociation). A pacemaker is required." },
    { q: "What is the specific class of Ticagrelor (Brilinta)?", o: ["DOAC", "Thrombolytic", "P2Y12 Platelet Inhibitor", "Glycoprotein IIb/IIIa Inhibitor"], a: 2, t: "Cardiac Pharmacology", e: "Ticagrelor is a P2Y12 receptor antagonist (antiplatelet). It prevents platelets from aggregating and clotting off the newly placed coronary stent." },
    { q: "What is the dual mechanism of action of Milrinone (Primacor) in cardiogenic shock?", o: ["Increases HR and vasoconstricts", "Positive inotrope (increases contractility) and potent vasodilator (decreases afterload)", "Slows HR and dilates coronaries", "Paralyzes the heart"], a: 1, t: "Cardiac Pharmacology", e: "Milrinone is an 'Inodilator' (PDE3 inhibitor). It massively increases the force of myocardial contraction while simultaneously causing potent vasodilation, drastically dropping afterload so the failing heart can pump easier." },
    { q: "Which laboratory test must be monitored specifically to adjust the dose of Enoxaparin (Lovenox)?", o: ["PT/INR", "aPTT", "Bleeding Time", "Routine lab monitoring for dose adjustment is not required"], a: 3, t: "Cardiac Pharmacology", e: "Unlike unfractionated Heparin, Enoxaparin (LMWH) has a highly predictable dose-response curve based purely on weight. Routine lab monitoring (aPTT) to adjust the dose is NOT required." },
    { q: "A patient with Endocarditis has a sudden left-sided paralysis and expressive aphasia. The vegetation likely broke off from which valve?", o: ["Tricuspid Valve", "Pulmonary Valve", "Mitral or Aortic Valve", "Eustachian Valve"], a: 2, t: "Cardiac Patho", e: "Left-sided paralysis/aphasia indicates a brain stroke (systemic circulation). The left heart (Mitral/Aortic valves) pumps blood to the brain. Vegetations breaking off here shoot up the carotids, causing embolic stroke." },
    { q: "An ECG for Wolff-Parkinson-White (WPW) syndrome shows a short PR interval and a slurred upstroke of the QRS. What is this wave called?", o: ["Osborn wave", "Delta wave", "Epsilon wave", "U wave"], a: 1, t: "ECG Interpretation", e: "WPW involves an accessory pathway (Bundle of Kent) bypassing the AV node. The electrical impulse hits the ventricles early, causing a short PR and a slurred start to the QRS, known as the Delta wave." },
    { q: "A patient on Furosemide has 3L urine output. ECG shows frequent PVCs and flattened T waves. Priority action?", o: ["Administer IV Amiodarone", "Check serum Potassium level and notify provider", "Increase Furosemide", "Administer Nitroglycerin"], a: 1, t: "Electrolytes", e: "Furosemide wastes potassium. Massive diuresis causes severe hypokalemia, leading to myocardial irritability (PVCs, flat T waves, U waves). Replacing potassium immediately is critical to prevent V-Tach/V-Fib." },
    { q: "What is the exact initial dose and route of Amiodarone in the Pulseless V-Tach / V-Fib ACLS algorithm?", o: ["150 mg IV push", "300 mg IV push", "150 mg over 10 mins", "1 mg IV push"], a: 1, t: "ACLS Protocol", e: "In Cardiac Arrest (Pulseless VT/VF), the initial dose of Amiodarone is a rapid 300 mg IV push. (Stable VT with a pulse gets 150 mg over 10 mins)." },
    { q: "A patient with a history of rheumatic fever has a loud 'snapping' S1 and a low-pitched diastolic rumble at the apex. Diagnosis?", o: ["Aortic Stenosis", "Mitral Regurgitation", "Mitral Stenosis", "Aortic Regurgitation"], a: 2, t: "Valvular Disease", e: "Rheumatic fever fuses the mitral valve (Mitral Stenosis). When the valve forces open during diastole, it 'snaps' loudly (opening snap), followed by a low-pitched diastolic rumble as blood struggles through the tight hole." },
    { q: "A 22-year-old athlete dies suddenly. Autopsy reveals a massively thickened, asymmetrical septum that obstructed the aortic outflow tract during exercise. Condition?", o: ["Dilated Cardiomyopathy", "Hypertrophic Obstructive Cardiomyopathy (HOCM)", "Restrictive Cardiomyopathy", "ARVD"], a: 1, t: "Cardiomyopathy", e: "HOCM involves massive septal thickening. During intense exercise, the heart pumps so hard the thick septum slams against the mitral leaflet, blocking blood from leaving the heart (outflow obstruction), causing sudden cardiac death." },
    { q: "Because a donor heart is completely denervated, a heart transplant patient will NOT experience which classic symptom during an MI?", o: ["Shortness of breath", "Chest pain (Angina)", "Fatigue", "Nausea"], a: 1, t: "Advanced Cardiology", e: "The vagus and sympathetic nerves are severed during transplant. With absolutely no pain nerves connecting the new heart to the brain, the patient will never feel chest pain (angina) during a heart attack." },
    { q: "A patient in severe shock receives continuous Dopamine at 15 mcg/kg/min. At this HIGH dose, which receptor is stimulated?", o: ["Dopaminergic (renal)", "Beta-1 (heart rate)", "Alpha-1 receptors; profound systemic vasoconstriction to raise BP", "Beta-2 (lungs)"], a: 2, t: "Cardiac Pharmacology", e: "Dopamine is dose-dependent. At high doses (>10-20 mcg/kg/min), it acts almost exclusively on Alpha-1 receptors, causing massive, profound systemic vasoconstriction to drive up blood pressure in severe shock." },
    { q: "A patient with a central line develops a massive Air Embolism. The nurse places the patient in the left lateral Trendelenburg position. Rationale?", o: ["Dissolves the air bubble", "Traps the air bubble in the apex of the right ventricle, preventing it from being pumped into the pulmonary artery", "Forces air out the jugular", "Prevents air crossing BBB"], a: 1, t: "Emergencies", e: "Air is lighter than blood. Head-down (Trendelenburg) on the Left Side turns the Right Ventricle upside down. The air bubble floats to the apex of the RV and stays trapped there, preventing a fatal air lock in the pulmonary artery." },
    { q: "A STEMI patient is ordered Ticagrelor (Brilinta) 180 mg PO stat. Why such a huge dose?", o: ["It is a loading dose designed to instantly and completely shut down platelets to stop the clot", "It dissolves the clot", "Protects stomach from Aspirin", "Lowers heart rate"], a: 0, t: "Cardiac Pharmacology", e: "Ticagrelor is a potent P2Y12 antiplatelet. In acute STEMI, a massive 'loading dose' (180 mg) achieves maximum platelet inhibition instantly, stopping the clot from growing while rushing to the cath lab." },
    { q: "Post-Transesophageal Echocardiogram (TEE), the patient asks for water. Mandatory FIRST action?", o: ["Check BP", "Assess return of the gag reflex using a tongue depressor", "Offer ice chip", "Auscultate bowels"], a: 1, t: "Diagnostics", e: "During a TEE, the throat is heavily sprayed with local anesthetics, paralyzing the gag reflex. Giving water before the reflex returns causes silent aspiration into the lungs. The nurse MUST physically test the gag reflex first." },
    { q: "A patient with crushing chest pain has a NORMAL 12-lead ECG, but initial high-sensitivity Troponin I is massively elevated. Exact diagnosis?", o: ["STEMI", "NSTEMI (Non-ST Elevation Myocardial Infarction)", "Unstable Angina", "Stable Angina"], a: 1, t: "ACS", e: "A normal/non-specific ECG combined with a positive Troponin means heart muscle is actively dying, but the blockage is incomplete or involves deep tissue not captured by the surface ECG. This is an NSTEMI. Unstable angina has NO troponin leak." },
    { q: "A patient with endocarditis is on IV Vancomycin and Gentamicin. Which two critical labs must be monitored daily to prevent toxicity?", o: ["AST/ALT", "BUN and Creatinine (Renal function)", "ANC", "PT/INR"], a: 1, t: "Cardiac Pharmacology", e: "Both Vancomycin and Gentamicin are highly NEPHROTOXIC and OTOTOXIC. When combined, they act synergistically to destroy the kidneys. Daily monitoring of BUN, Creatinine, and drug levels is absolutely mandatory." },
    { q: "A patient with massive PE receives IV Alteplase (tPA). What is the exact mechanism of action?", o: ["Stops platelets from clumping", "Turns off coagulation cascade", "Binds to fibrin and converts plasminogen into active plasmin, violently dissolving the existing clot", "Paralyzes lungs"], a: 2, t: "Cardiac Pharmacology", e: "Alteplase is a thrombolytic. It binds directly to the fibrin mesh and unleashes plasmin, which violently rips the clot apart molecule by molecule, instantly restoring blood flow." },
    { q: "A patient's ECG shows a 'coved' ST-segment elevation (>2mm) in leads V1-V3 followed by a negative T wave, and the patient has a history of unexplained syncope. This highly lethal genetic rhythm disorder is:", o: ["Long QT Syndrome", "Brugada Syndrome", "WPW Syndrome", "Wellens Syndrome"], a: 1, t: "ECG Interpretation", e: "Brugada Syndrome is a genetic sodium channelopathy. The classic ECG sign is a 'coved' ST elevation in V1-V3. It causes sudden cardiac death (V-Fib) in young, otherwise healthy individuals (often during sleep). Requires an ICD." },
    { q: "A patient experiences angina episodes exclusively at rest (often midnight to early morning), with transient ST-segment elevation on the monitor that resolves when the pain stops. Diagnosis?", o: ["Stable Angina", "Prinzmetal's (Variant) Angina", "NSTEMI", "Aortic Dissection"], a: 1, t: "ACS Variations", e: "Prinzmetal's Angina is caused by severe coronary artery VASOSPASM, not atherosclerotic plaque. It happens at rest, causing transient ST elevation that reverses when the spasm breaks (often treated with Calcium Channel Blockers)." },
    { q: "A patient with end-stage heart failure has a Left Ventricular Assist Device (LVAD) placed. The nurse attempts to take a manual blood pressure and cannot hear Korotkoff sounds, nor feel a radial pulse. The patient is awake and talking. What is the explanation?", o: ["The patient is in cardiogenic shock", "The LVAD is a continuous-flow pump, meaning there is no pulsatile blood flow, therefore no palpable pulse or standard blood pressure", "The LVAD has failed", "The blood pressure cuff is defective"], a: 1, t: "Advanced Devices", e: "Modern LVADs use a continuous centrifugal or axial flow pump. Blood flows continuously, not in beats. Therefore, the patient will have NO palpable pulse and NO measurable systolic/diastolic blood pressure. Mean Arterial Pressure (MAP) is measured via Doppler." },
    { q: "A patient is 12 hours post-op from a CABG. The chest tube output was 30 mL/hr, but suddenly increases to 250 mL of bright red blood in one hour. What is the nurse's priority?", o: ["Milk the chest tube aggressively", "Notify the surgeon immediately, as this indicates active surgical hemorrhage", "Document the finding as normal post-op clearing", "Clamp the chest tube"], a: 1, t: "Post-Op Cardiac", e: "Chest tube drainage > 150 mL/hr of bright red blood after the first few hours post-CABG is a major red flag for active surgical hemorrhage. The surgeon must be notified immediately as the patient may need to return to the OR." },
    { q: "An ECG shows deeply inverted, symmetric T waves in leads V2 and V3 in a patient who is currently pain-free but had chest pain earlier. This pattern is highly specific for critical stenosis of the proximal LAD artery and is known as:", o: ["De Winter's T waves", "Wellens' Syndrome", "Brugada pattern", "Osborn waves"], a: 1, t: "ECG Interpretation", e: "Wellens' Syndrome presents with biphasic or deeply inverted T waves in V2-V3 in a pain-free state. It is a massive warning sign of critical, impending occlusion of the proximal Left Anterior Descending (LAD) artery, requiring urgent cath." },
    { q: "A patient on Valsartan/Sacubitril (Entresto) is admitted. The provider decides to switch the patient back to Lisinopril. The nurse knows there MUST be a mandatory 'washout' period of how many hours between stopping Entresto and starting an ACE Inhibitor?", o: ["12 hours", "24 hours", "36 hours", "48 hours"], a: 2, t: "Cardiac Pharmacology", e: "Sacubitril inhibits neprilysin, increasing bradykinin. ACE inhibitors also increase bradykinin. Taking them together causes catastrophic, fatal angioedema. A strict 36-hour washout period is legally and clinically required between stopping Entresto and starting any ACE inhibitor." },
    { q: "A patient on Digoxin presents with a classic ECG sign of Digoxin EFFECT (not necessarily toxicity). What does this look like?", o: ["Peaked T waves", "A 'scooped' or 'sagging' ST-segment depression (Salvador Dali mustache)", "Prolonged QT interval", "Delta waves"], a: 1, t: "ECG Interpretation", e: "Therapeutic levels of Digoxin cause a characteristic 'scooped' or 'sagging' ST-segment depression, often compared to a Salvador Dali mustache. This is a normal drug effect, whereas arrhythmias or visual halos indicate actual toxicity." },
    { q: "An ECG shows prominent U waves following the T waves, along with ST depression. This is the classic ECG manifestation of which electrolyte imbalance?", o: ["Hyperkalemia", "Hypokalemia", "Hypercalcemia", "Hyponatremia"], a: 1, t: "Electrolytes / ECG", e: "Severe Hypokalemia prolongs ventricular repolarization, flattening the T wave and producing a prominent U wave immediately after the T wave." },
    { q: "A patient with renal failure misses dialysis. The ECG shows massive, tall, peaked T waves and the QRS complex is beginning to widen into a sine-wave pattern. Which electrolyte imbalance is causing this lethal progression?", o: ["Hyperkalemia", "Hypokalemia", "Hypercalcemia", "Hypomagnesemia"], a: 0, t: "Electrolytes / ECG", e: "Hyperkalemia alters the resting membrane potential. It progresses classically: Tall peaked T waves -> Loss of P waves -> Widening of the QRS complex -> merging into a Sine-Wave pattern -> Ventricular Fibrillation/Asystole." },
    { q: "A patient is given IV Adenosine 6mg for SVT. The nurse pushes it over 1-2 seconds, instantly flushes with 20mL normal saline, and elevates the patient's arm. Why is this exact technique mandatory?", o: ["To prevent vein necrosis", "Adenosine has an extremely short half-life (less than 10 seconds) and will be destroyed by red blood cells before reaching the heart if not pushed rapidly", "To prevent a massive spike in blood pressure", "To mix the drug with saline in the vein"], a: 1, t: "Cardiac Pharmacology", e: "Adenosine is rapidly metabolized by enzymes on red blood cells, giving it a half-life of less than 10 seconds. It must be slammed in as a rapid IV push, followed by a rapid 20mL flush and arm elevation, to physically force the drug to the AV node before it vanishes." },
    { q: "A patient with atrial fibrillation is prescribed Sotalol (Betapace). The nurse knows this drug has both Beta-blocker and Class III antiarrhythmic properties. What is the most dangerous ECG change the nurse must monitor for?", o: ["Shortened PR interval", "Prolonged QT interval leading to Torsades de Pointes", "ST segment elevation", "Loss of P waves"], a: 1, t: "Cardiac Pharmacology", e: "Sotalol blocks potassium channels (Class III effect), significantly delaying repolarization. This strictly prolongs the QT interval, placing the patient at severe risk for developing Torsades de Pointes. Initiation often requires 3 days of inpatient ECG monitoring." },
    { q: "A patient with severe Aortic Regurgitation is assessed. The nurse palpates the radial pulse and feels a rapid, forceful expansion that immediately and suddenly collapses. This classic finding is known as:", o: ["Pulsus Alternans", "Pulsus Paradoxus", "Water-Hammer (Corrigan's) Pulse", "Pulsus Parvus et Tardus"], a: 2, t: "Cardiovascular Assessment", e: "In Aortic Regurgitation, the incompetent valve lets blood dump backward into the left ventricle during diastole. This creates a massive stroke volume (forceful upstroke) followed by an instant drop in pressure as blood falls back (sudden collapse), known as a Water-Hammer or Corrigan's pulse." },
    { q: "A child with Tetralogy of Fallot frequently squats during play. The physiological mechanism by which squatting relieves hypoxia is identical to which nursing intervention?", o: ["Administering Oxygen", "Placing an infant in the knee-chest position", "Administering IV Morphine", "Performing CPR"], a: 1, t: "Peds Cardiology", e: "Squatting sharply kinks the femoral arteries, massively increasing Systemic Vascular Resistance (SVR). This high aortic pressure forces blood through the stenotic pulmonary valve instead of the VSD, oxygenating the blood. The knee-chest position does the exact same anatomical kinking for an infant." },
    { q: "A child is diagnosed with Kawasaki Disease. What is the absolute primary cause of mortality in this condition if left untreated?", o: ["Encephalitis", "Coronary artery aneurysms leading to myocardial infarction", "Renal failure", "Pulmonary hemorrhage"], a: 1, t: "Peds Cardiology", e: "Kawasaki is a severe systemic vasculitis targeting the coronary arteries. Inflammation destroys the artery walls, causing massive coronary aneurysms that clot and rupture, causing fatal MIs in young children. IVIG and high-dose Aspirin are mandatory." },
    { q: "A newborn is assessed and the nurse auscultates a loud, continuous, 'machine-like' murmur at the left upper sternal border. This is the classic hallmark of which congenital defect?", o: ["Patent Ductus Arteriosus (PDA)", "Ventricular Septal Defect (VSD)", "Atrial Septal Defect (ASD)", "Coarctation of the Aorta"], a: 0, t: "Peds Cardiology", e: "A PDA connects the aorta to the pulmonary artery. Because pressure in the aorta is higher during BOTH systole and diastole, blood flows continuously through the shunt all the time, creating the classic continuous 'machinery' murmur." },
    { q: "A pediatric patient has strong, bounding pulses in the arms and a blood pressure of 140/90, but weak/absent femoral pulses and a blood pressure of 80/50 in the legs. Diagnosis?", o: ["Tetralogy of Fallot", "Coarctation of the Aorta", "Transposition of the Great Arteries", "Tricuspid Atresia"], a: 1, t: "Peds Cardiology", e: "Coarctation is a severe narrowing (pinching) of the descending aorta. Blood pressure is massively high proximal to the pinch (arms/head) and severely low distal to the pinch (legs), resulting in the classic BP/pulse disparity." },
    { q: "An infant is born cyanotic with Transposition of the Great Arteries (TGA). The provider orders a continuous infusion of Alprostadil (Prostaglandin E1). What is the exact purpose of this medication?", o: ["Close the PDA", "Keep the Patent Ductus Arteriosus (PDA) open to allow mixing of oxygenated and deoxygenated blood", "Decrease pulmonary resistance", "Increase contractility"], a: 1, t: "Peds Pharmacology", e: "In TGA, the aorta and pulmonary artery are switched, creating two unmixed, parallel circuits (fatal). PGE1 is given to purposefully KEEP the PDA open so blood can mix between the two circuits, keeping the infant alive until surgery." },
    { q: "In a patient with a Ventricular Septal Defect (VSD), blood naturally shunts from Left to Right. Why?", o: ["The right ventricle is larger", "Pressure in the Left Ventricle is significantly higher than in the Right Ventricle", "Gravity pulls it to the right", "The pulmonary valve blocks the right ventricle"], a: 1, t: "Peds Cardiology", e: "The Left Ventricle pumps to the entire body, so its pressure is massively higher than the Right Ventricle (which only pumps to the lungs). In a VSD, blood takes the path of least resistance, shunting Left to Right, flooding the lungs with extra blood." },
    { q: "A patient is evaluated for Infective Endocarditis using the Duke Criteria. Which of the following is considered a MAJOR criterion?", o: ["Fever > 38°C", "Predisposing heart condition or IV drug use", "Positive blood cultures for typical microorganisms (e.g., Staph aureus) drawn 12 hours apart", "Osler's nodes"], a: 2, t: "Diagnostic Criteria", e: "Under the Duke Criteria, MAJOR criteria include two separate positive blood cultures with typical endocarditis organisms, and evidence of endocardial involvement on an Echocardiogram (vegetation/abscess). Fever, IV drug use, and Osler nodes are MINOR criteria." },
    { q: "During synchronized cardioversion for Unstable SVT, the defibrillator must be placed in 'SYNC' mode. On which specific part of the ECG waveform does the machine perfectly time the shock to fall?", o: ["The P wave", "The R wave", "The T wave", "The ST segment"], a: 1, t: "ACLS Procedures", e: "SYNC mode searches for the highest amplitude peak (the R wave of ventricular depolarization) and delivers the shock exactly on it. It strictly avoids shocking during the T wave (repolarization), which would cause the 'R-on-T' phenomenon and throw the patient into lethal Ventricular Fibrillation." },
    { q: "A patient presents with Polymorphic Ventricular Tachycardia (Torsades) and has NO pulse. The nurse prepares the defibrillator. Should the nurse use SYNCHRONIZED or UNSYNCHRONIZED shock?", o: ["Synchronized, because it is a tachycardia", "Unsynchronized, because there are no uniform R waves for the machine to sync with, and the patient is pulseless", "Synchronized on the T wave", "Wait for Amiodarone to work first"], a: 1, t: "ACLS Procedures", e: "In polymorphic V-Tach, the QRS complexes constantly change shape and size. The machine cannot find a uniform R wave to sync with. Attempting to sync will delay the shock indefinitely. A pulseless patient with polymorphic VT requires an immediate UNSYNCHRONIZED high-energy defibrillation." },
    { q: "A patient on a Heparin drip develops Heparin-Induced Thrombocytopenia (HIT) Type II. What is the specific pathophysiology?", o: ["Heparin physically destroys platelets", "The body forms IgG antibodies against the Heparin-PF4 complex, which massively activates platelets, causing severe paradoxical thrombosis", "Heparin suppresses bone marrow production", "Heparin binds to Vitamin K"], a: 1, t: "Cardiac Patho", e: "HIT Type II is an immune-mediated catastrophe. Antibodies bind to the Heparin-Platelet Factor 4 complex. Instead of destroying the platelets, this massively ACTIVATES them. The platelets clump together everywhere, causing catastrophic arterial and venous thromboses, while simultaneously dropping the platelet count." },
    { q: "A patient with HIT is started on an Argatroban infusion. The nurse knows this medication works by:", o: ["Binding to Antithrombin III", "Directly and reversibly binding to the active site of Thrombin, inhibiting clot formation without requiring Antithrombin", "Dissolving fibrin mesh", "Blocking Vitamin K"], a: 1, t: "Cardiac Pharmacology", e: "Argatroban is a Direct Thrombin Inhibitor (DTI). Unlike Heparin (which needs Antithrombin III to work), Argatroban bypasses that entire system and binds directly to Thrombin itself, completely neutralizing it. It does not trigger HIT antibodies, making it the perfect replacement anticoagulant." },
    { q: "Fondaparinux (Arixtra) is a synthetic anticoagulant. Unlike standard LMWH, it acts as a highly selective inhibitor of which specific clotting factor?", o: ["Factor II (Thrombin)", "Factor VII", "Factor Xa", "Factor VIII"], a: 2, t: "Cardiac Pharmacology", e: "Fondaparinux is a synthetic pentasaccharide that selectively binds to Antithrombin III to cause massive, specific inhibition of Factor Xa ONLY. It has zero effect on Thrombin (Factor IIa) and does not cross-react with HIT antibodies." },
    { q: "A patient with an acute ischemic stroke is a candidate for tPA. The patient's blood pressure is 190/115 mmHg. Why is this an absolute contraindication for immediate tPA administration?", o: ["High BP inactivates the tPA enzyme", "It causes massive pulmonary edema", "Severe hypertension (>185/110) exponentially increases the risk of fatal intracranial hemorrhage if tPA is given", "It causes anaphylaxis"], a: 2, t: "Neuro/Cardiac Pharmacology", e: "tPA shreds clots but destroys the blood's ability to coagulate. The brain tissue in an ischemic stroke is already damaged and friable. Pushing blood into that damaged brain at extremely high pressures (>185/110) while the blood cannot clot will almost certainly cause a massive, fatal hemorrhagic conversion. BP must be lowered first." },
    { q: "A patient has an Inferior Wall MI (ST elevation in II, III, aVF). The provider orders a Right-Sided ECG. Which specific lead placement is critical to diagnose a Right Ventricular Infarct?", o: ["V1 and V2", "V4R (placed at the right 5th intercostal space, midclavicular line)", "V7, V8, V9 on the back", "aVR and aVL"], a: 1, t: "ECG Procedures", e: "A standard 12-lead ECG looks mostly at the Left Ventricle. To see the Right Ventricle, the precordial leads must be moved to the right side of the chest. ST elevation in lead V4R is the most sensitive and specific marker for a Right Ventricular Infarction." },
    { q: "A patient complains of chest pain. The standard 12-lead ECG shows deep ST-segment depression and tall, prominent R waves in leads V1 and V2, but NO ST elevation anywhere. The provider orders leads V7, V8, and V9. What is the suspected diagnosis?", o: ["Anterior STEMI", "Posterior Wall Myocardial Infarction", "Right Ventricular MI", "Pulmonary Embolism"], a: 1, t: "ECG Interpretation", e: "The standard 12-lead does not look at the back of the heart. A Posterior MI shows up as the 'mirror image' of an Anterior MI. Instead of ST elevation and Q waves in V1/V2, you see ST depression and tall R waves. Placing leads on the patient's back (V7, V8, V9) will reveal the true ST elevation." },
    { q: "An ECG reveals tall, prominent, symmetric T waves originating from down-sloping ST segment depression at the J point in precordial leads. The patient had chest pain that is now resolved. This is known as:", o: ["De Winter's T waves", "Brugada pattern", "Osborn waves", "Wellen's pattern"], a: 0, t: "ECG Interpretation", e: "De Winter's T waves are an exact ECG pattern (ST depression at the J point with tall, peaked symmetric T waves) that signifies a massive, acute occlusion of the proximal LAD artery. It is a STEMI equivalent and requires immediate cath lab activation, even without classic ST elevation." },
    { q: "B-type Natriuretic Peptide (BNP) is a blood test used to diagnose Heart Failure. What exact mechanical event in the heart triggers the release of BNP?", o: ["Ischemia of the myocardial cells", "Inflammation of the pericardium", "Excessive stretching of the ventricular muscle fibers due to fluid volume overload and high pressure", "A fast heart rate"], a: 2, t: "Cardiac Labs", e: "BNP is stored in the ventricles. When the heart is failing and fills with too much fluid, the walls physically stretch. This mechanical stretch tears the cells open, releasing massive amounts of BNP into the blood. BNP tries to force the kidneys to pee out the extra fluid (diuresis) to stop the stretching." },
    { q: "A patient with heart failure is prescribed Eplerenone (Inspra) instead of Spironolactone. What is the clinical advantage of Eplerenone over Spironolactone?", o: ["It is a much stronger diuretic", "It does not spare potassium", "It is highly selective for aldosterone receptors and does NOT cause painful gynecomastia (breast enlargement) in males", "It lowers blood pressure faster"], a: 2, t: "Cardiac Pharmacology", e: "Spironolactone blocks aldosterone but also blocks androgen receptors, causing severe gynecomastia and impotence in men, leading to poor compliance. Eplerenone is a newer, highly selective aldosterone antagonist that does not touch androgen receptors, eliminating the gynecomastia side effect." },
    { q: "A patient with chronic heart failure has a heart rate of 85 bpm despite maximum tolerated doses of Beta-Blockers. The provider adds Ivabradine (Corlanor). What is the highly specific mechanism of action?", o: ["Blocks calcium channels in the ventricles", "Selectively inhibits the 'funny' (If) current channels specifically in the SA node, slowing the heart rate without affecting contractility or blood pressure", "Acts as a potent vasodilator", "Increases vagal tone"], a: 1, t: "Cardiac Pharmacology", e: "Ivabradine is unique. It only works on the 'funny' (If) channels inside the Sinoatrial (SA) node pacemaker cells. By slowing the firing of these cells, it purely lowers the heart rate, allowing more filling time for the failing heart. It has zero effect on blood pressure or contraction strength." },
    { q: "A patient with A-Fib is being initiated on Dofetilide (Tikosyn). The nurse knows the patient MUST be admitted to the hospital for a minimum of 3 days. What is the absolute reason for this mandatory hospitalization?", o: ["It requires continuous IV titration", "To monitor for severe hepatotoxicity", "To perform continuous ECG monitoring for QT prolongation and fatal Torsades de Pointes", "To monitor for massive internal bleeding"], a: 2, t: "Cardiac Pharmacology", e: "Dofetilide is a potent Class III antiarrhythmic. It violently prolongs the QT interval. It is so dangerous that initiation legally requires 3 days of strict inpatient continuous telemetry monitoring. If the QT interval prolongs too much, it will trigger sudden Torsades de Pointes and death." },
    { q: "A patient in the ED has symptomatic bradycardia. The nurse administers IV Atropine 1 mg. The heart rate does not improve. The nurse repeats the 1 mg dose twice more. The total dose given is 3 mg. The provider orders another 1 mg. What is the nurse's response?", o: ["Administer the dose as ordered", "Refuse the order, as the absolute maximum cumulative dose of Atropine is 3 mg; further doses will not work because the vagus nerve is fully blocked", "Request IV Epinephrine instead", "Both B and C"], a: 3, t: "ACLS Protocol", e: "Atropine works by completely blocking the vagus nerve's parasympathetic input to the heart. Once you give 3 mg, the vagus nerve is 100% blocked (fully saturated). Giving more Atropine is physiologically useless. You must move to the next algorithm step: TCP or Dopamine/Epi infusions." },
    { q: "A patient with a temporary transvenous pacemaker is admitted. The nurse notes pacemaker spikes happening randomly, ignoring the patient's own P waves and QRS complexes. What is this malfunction?", o: ["Failure to capture", "Failure to pace", "Failure to sense (Undersensing)", "Oversensing"], a: 2, t: "Pacemakers", e: "Undersensing means the pacemaker's 'eyes' are closed. It cannot see (sense) the patient's intrinsic heartbeats. Because it thinks the heart stopped, it fires its electrical spikes randomly and dangerously, risking an R-on-T phenomenon and V-Fib." },
    { q: "A trauma patient arrives with suspected Cardiac Tamponade. Which three signs constitute Beck's Triad?", o: ["Hypertension, Bradycardia, Irregular Respirations", "Hypotension, Jugular Venous Distention (JVD), Muffled/Distant Heart Sounds", "Hypotension, Tachycardia, Flat Neck Veins", "Muffled heart sounds, Pulmonary edema, Hypertension"], a: 1, t: "Cardiovascular Emergencies", e: "Beck's Triad defines Cardiac Tamponade. Blood filling the pericardial sac crushes the heart. The right heart can't fill, so blood backs up into the neck (JVD). The heart can't pump, causing shock (Hypotension). The thick layer of blood muffles the noise of the beating heart (Muffled heart sounds)." },
    { q: "A patient with Cardiac Tamponade exhibits Pulsus Paradoxus. The nurse understands this phenomenon occurs because:", o: ["Inspiration decreases intrathoracic pressure, increasing venous return to the right ventricle, which balloons out and crushes the left ventricle against the fluid-filled pericardium, dropping systolic BP > 10 mmHg", "Expiration causes a massive spike in blood pressure", "The heart skips a beat during inspiration", "The pulse feels stronger than the actual blood pressure"], a: 0, t: "Hemodynamics", e: "Normally, inspiration drops BP slightly. In Tamponade, the heart is trapped in a tight box of fluid. During inspiration, the right ventricle fills with extra blood, but it can't expand outward. Instead, it bulges inward, crushing the left ventricle, causing a massive (>10 mmHg) drop in stroke volume and systolic BP." },
    { q: "A patient with severe Right-Sided Heart Failure (Cor Pulmonale) exhibits Kussmaul's Sign. What is the clinical finding of this sign?", o: ["Deep, rapid, gasping respirations", "A paradoxical RISE in Jugular Venous Pressure (JVD worsens) during inspiration", "A massive drop in blood pressure during inspiration", "Bluish discoloration around the umbilicus"], a: 1, t: "Cardiovascular Assessment", e: "Normally, JVD decreases during inspiration as blood is sucked into the chest. In severe right heart failure or constrictive pericarditis, the right heart cannot accept any more blood. When inspiration sucks blood into the chest, it hits a brick wall at the right atrium and backs up instantly, causing the neck veins to visibly swell (rise) during inhalation." },
    { q: "A young patient presents with chest pain, heart failure symptoms, and elevated troponins after a severe viral illness. The ECG shows non-specific ST changes. An endomyocardial biopsy confirms lymphocyte infiltration of the myocardium. Diagnosis?", o: ["Acute Pericarditis", "Acute Myocarditis", "STEMI", "Endocarditis"], a: 1, t: "Cardiac Pathophysiology", e: "Myocarditis is an inflammation of the actual heart muscle itself, almost always caused by a virus (like Coxsackievirus). The virus directly attacks the muscle cells, causing cell death (high troponin), pump failure, and lethal arrhythmias. Pericarditis is inflammation of the sac around the heart, without muscle death." },
    { q: "A patient undergoes a Transcatheter Aortic Valve Replacement (TAVR). 12 hours post-op, the patient's heart rate drops to 30 bpm, and the ECG shows complete AV dissociation. What specific complication of TAVR has occurred?", o: ["Aortic dissection", "Coronary artery occlusion", "Third-Degree (Complete) AV Block caused by physical compression of the AV node/Bundle of His by the new valve frame", "Stroke"], a: 2, t: "Advanced Procedures", e: "The AV node and Bundle of His lie anatomically millimeters away from the aortic valve annulus. When a massive TAVR stent valve is expanded into place, it often physically crushes the electrical conduction system, instantly causing a Complete AV Block. A permanent pacemaker is frequently required." },
    { q: "A patient who suffered a severe myocardial infarction 4 weeks ago returns to the clinic complaining of pleuritic chest pain and a low-grade fever. The nurse hears a pericardial friction rub. What immune-mediated complication is this?", o: ["Recurrent MI", "Dressler's Syndrome (Post-Myocardial Infarction Syndrome)", "Ventricular Free Wall Rupture", "Pneumonia"], a: 1, t: "Post-MI Complications", e: "Dressler's Syndrome is an autoimmune response that occurs weeks to months after a large MI. The immune system creates antibodies against the dead heart tissue, which inadvertently attack the pericardial sac, causing late-onset acute pericarditis (chest pain, fever, friction rub). Treated with NSAIDs/Colchicine." },
    { q: "A patient arrives at the ED via ambulance with a confirmed STEMI. According to the AHA/ACC guidelines, what is the absolute maximum 'Door-to-Balloon' time goal for opening the blocked artery in the Cath Lab?", o: ["30 minutes", "60 minutes", "90 minutes", "120 minutes"], a: 2, t: "ACS Guidelines", e: "Time is muscle. The universal gold-standard metric for STEMI care is a 'Door-to-Balloon' time of 90 minutes or less. This means from the exact minute the patient rolls through the ED doors, the team has 90 minutes to get them to the cath lab, pass a wire, and inflate a balloon to restore blood flow." }
];

let currentQ = 0;
let score = 0;
let answeredCount = 0;
let answersData = new Array(questions.length).fill(null);

const quizBody = document.getElementById('quiz-body');
const scoreEl = document.getElementById('score');
const qCounterEl = document.getElementById('q-counter');
const progressEl = document.getElementById('progress');

function initQuiz() {
    questions.forEach((q, index) => {
        const qDiv = document.createElement('div');
        qDiv.className = `question-container ${index === 0 ? 'active' : ''}`;
        qDiv.id = `question-${index}`;
        
        qDiv.innerHTML = `
            <div class="subject-tag">${q.t}</div>
            <div class="q-text">Q${index + 1}: ${q.q}</div>
            <div class="options" id="options-${index}">
                ${q.o.map((opt, optIndex) => `
                    <button class="option-btn" onclick="checkAnswer(${index},${optIndex}, this)">
                        ${String.fromCharCode(65 + optIndex)}.${opt}
                    </button>
                `).join('')}
            </div>
            <div class="rationale" id="rationale-${index}">
                <strong>Why this is correct:</strong> ${q.e}
            </div>
            <div class="navigation">
                <button class="nav-btn" onclick="changeQuestion(-1)" ${index === 0 ? 'disabled' : ''}>Previous</button>
                <button class="nav-btn" onclick="changeQuestion(1)">${index === questions.length - 1 ? 'Submit Exam' : 'Next Question'}</button>
            </div>
        `;
        quizBody.appendChild(qDiv);
    });
    updateProgress();
}

function checkAnswer(qIndex, selectedOptIndex, btnElement) {
    if (answersData[qIndex] !== null) return; 
    
    const optionsContainer = document.getElementById(`options-${qIndex}`);
    const buttons = optionsContainer.querySelectorAll('.option-btn');
    const correctIndex = questions[qIndex].a;
    const rationaleBox = document.getElementById(`rationale-${qIndex}`);

    answersData[qIndex] = selectedOptIndex;
    buttons.forEach(btn => btn.classList.add('disabled'));

    if (selectedOptIndex === correctIndex) {
        btnElement.classList.add('correct');
        score += 1;
    } else {
        btnElement.classList.add('incorrect');
        buttons[correctIndex].classList.add('correct'); 
        score -= 0.3333; 
    }
    
    rationaleBox.style.display = 'block';
    answeredCount++;
    scoreEl.innerText = score.toFixed(2);
}

function changeQuestion(direction) {
    if (direction === 1 && currentQ === questions.length - 1) {
        finishExam();
        return;
    }
    
    document.getElementById(`question-${currentQ}`).classList.remove('active');
    currentQ += direction;
    document.getElementById(`question-${currentQ}`).classList.add('active');
    
    qCounterEl.innerText = `Question: ${currentQ + 1} / 100`;
    updateProgress();
    window.scrollTo(0, 0);
}

function updateProgress() {
    const percent = ((currentQ + 1) / questions.length) * 100;
    progressEl.style.width = `${percent}%`;
}

function finishExam() {
    let unattempted = questions.length - answeredCount;
    if(unattempted > 0) {
        let confirmFinish = confirm(`WARNING: You have ${unattempted} unattempted questions. Are you sure you want to submit the exam?`);
        if(!confirmFinish) return;
    }

    quizBody.style.display = 'none';
    document.querySelector('.dashboard').style.display = 'none';
    document.querySelector('.progress-bar').style.display = 'none';
    document.getElementById('results-screen').style.display = 'block';
    
    let finalScoreFormatted = score < 0 ? "0.00" : score.toFixed(2);
    document.getElementById('final-score-display').innerText = `${finalScoreFormatted} / 100`;
}

window.onload = initQuiz;
</script>

</body>
</html>
