        .header h1 { margin: 0 0 10px 0; font-size: 2.6em; color: #fb7185; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 800; }

        .dashboard { display: flex; justify-content: space-between; margin-top: 25px; padding-top: 20px; border-top: 1px solid #334155; font-weight: 700; font-size: 1.4em; color: #e2e8f0; }

        .option-btn.incorrect { background: #7f1d1d; border-color: #ef4444; color: #fecaca; box-shadow: 0 0 20px rgba(239, 68, 68, 0.25); }

        .rationale { margin-top: 35px; padding: 25px; background: rgba(225, 29, 72, 0.05); border-left: 6px solid #e11d48; border-radius: 0 12px 12px 0; display: none; font-size: 1.15em; color: #ffe4e6; animation: fadeIn 0.6s; line-height: 1.7; border-top: 1px solid rgba(225, 29, 72, 0.2); border-right: 1px solid rgba(225, 29, 72, 0.2); border-bottom: 1px solid rgba(225, 29, 72, 0.2); }
        .rationale strong { color: #fb7185; font-size: 1.2em; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 15px; border-bottom: 1px solid rgba(225, 29, 72, 0.3); padding-bottom: 8px; }

        .nav-btn:hover:not(:disabled) { background: #be123c; box-shadow: 0 5px 15px rgba(225, 29, 72, 0.4); transform: translateY(-2px); }

        .progress-fill { height: 100%; background: linear-gradient(90deg, #be123c, #fb7185); width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        
        #results-screen { display: none; background: #1e293b; padding: 60px; border-radius: 16px; text-align: center; border: 1px solid #334155; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }

<script>
// 100 High-Level Cardiology Scenario Questions
const questions = [
    { q: "A 68-year-old male presents with a crushing substernal chest pain. The 12-lead ECG reveals ST-segment elevation in leads II, III, and aVF. The patient's BP is 85/50 mmHg, HR 52 bpm, and lung sounds are completely clear. What is the absolute MOST dangerous intervention the nurse could perform?", o: ["Administering a 500 mL normal saline bolus", "Administering sublingual Nitroglycerin", "Administering Aspirin 325 mg chewed", "Obtaining a right-sided ECG (V4R)"], a: 1, t: "Acute Coronary Syndrome", e: "ST elevation in II, III, and aVF indicates an Inferior Wall MI, which frequently involves the Right Ventricle. A right ventricular infarction destroys the right heart's pumping ability, making it totally dependent on preload (venous return). Nitroglycerin is a potent venodilator. Giving Nitro pools blood in the veins, instantly destroying preload, and causing catastrophic, fatal hypotension. They need IV fluids, not Nitro." },
    { q: "A patient with severe heart failure is admitted to the ICU. Hemodynamic monitoring via a Swan-Ganz catheter reveals a Central Venous Pressure (CVP) of 18 mmHg, a Pulmonary Artery Wedge Pressure (PAWP) of 24 mmHg, and a Cardiac Index of 1.6 L/min/m2. What is the primary defining state of this patient?", o: ["Right-sided heart failure only (Cor Pulmonale)", "Hypovolemic Shock", "Biventricular failure leading to Cardiogenic Shock", "Septic Shock"], a: 2, t: "Hemodynamics", e: "Normal CVP is 2-8 mmHg (high indicates right-sided failure). Normal PAWP is 6-12 mmHg (24 indicates profound left-sided failure with pulmonary congestion). A Cardiac Index < 2.2 L/min/m2 confirms severe pump failure (Cardiogenic Shock). This patient has catastrophic biventricular failure." },
    { q: "A patient with an intra-aortic balloon pump (IABP) suddenly develops a sudden drop in radial pulse on the left arm, decreased urine output (10 mL/hr), and absent bowel sounds. What complication of the IABP should the nurse immediately suspect?", o: ["Balloon rupture causing helium embolus", "Upward or downward migration of the balloon catheter", "Infection at the femoral insertion site", "Aortic dissection"], a: 1, t: "Hemodynamics / Devices", e: "If the IABP catheter migrates UPWARD, it blocks the left subclavian artery (loss of left radial pulse). If it migrates DOWNWARD, it blocks the renal and mesenteric arteries (severe oliguria and absent bowel sounds/ischemia). The nurse must stop pumping and notify the provider immediately to confirm placement via X-ray." },
    { q: "A patient on the telemetry unit suddenly shows a rhythm of polymorphic ventricular tachycardia with a constantly shifting axis (Torsades de Pointes). The patient is awake but dizzy, with a BP of 100/60. What is the first-line pharmacological treatment?", o: ["IV Amiodarone 150 mg", "IV Magnesium Sulfate 1-2 grams", "IV Lidocaine 1 mg/kg", "Synchronized Cardioversion"], a: 1, t: "ECG / Arrhythmias", e: "Torsades de Pointes is a specific lethal arrhythmia caused by a prolonged QT interval, almost always associated with hypomagnesemia. The definitive first-line pharmacological treatment for a hemodynamically stable patient is IV Magnesium Sulfate to stabilize the cardiac membrane. (Unstable = Unsynchronized defibrillation, not synchronized)." },
    { q: "A patient is 6 hours post-op from a Coronary Artery Bypass Graft (CABG). The mediastinal chest tubes have been draining 100 mL/hr. Suddenly, the drainage stops completely. Thirty minutes later, the patient's BP drops to 80/50, heart sounds are distant, and CVP spikes to 20 mmHg. What is the diagnosis?", o: ["Tension Pneumothorax", "Hypovolemic Shock due to internal bleeding", "Cardiac Tamponade", "Acute Myocardial Infarction"], a: 2, t: "Post-Op Cardiac", e: "The sudden cessation of chest tube drainage post-cardiac surgery strongly suggests a clot in the tube. Blood accumulates in the pericardial sac, compressing the heart (Cardiac Tamponade). Classic signs are Beck's Triad: severe hypotension, elevated CVP (JVD), and muffled/distant heart sounds. The surgeon must be notified for immediate exploration or pericardiocentesis." },
    { q: "A patient with chronic Atrial Fibrillation is prescribed Warfarin (Coumadin). The patient presents to the ED with severe epistaxis and hematuria. The INR is 6.5. Which order should the nurse anticipate immediately?", o: ["Administer Protamine Sulfate", "Administer Vitamin K (Phytonadione) and Fresh Frozen Plasma (FFP)", "Administer IV Heparin bridge therapy", "Administer Aminocaproic Acid (Amicar)"], a: 1, t: "Cardiac Pharmacology", e: "An INR of 6.5 with active, severe bleeding is a life-threatening emergency. Warfarin toxicity is treated with its direct antidote, Vitamin K. Because Vitamin K takes hours to stimulate the liver to make new clotting factors, Fresh Frozen Plasma (FFP) must be given simultaneously to provide instant, ready-made clotting factors to stop the bleeding." },
    { q: "During a code blue, a patient is in Ventricular Fibrillation. The team has performed CPR, defibrillated twice, and given 1 mg of Epinephrine. The rhythm remains V-Fib. What is the next drug the nurse should prepare according to ACLS guidelines?", o: ["Atropine 1 mg", "Amiodarone 300 mg", "Lidocaine 1.5 mg/kg", "Epinephrine 1 mg"], a: 1, t: "ACLS Protocol", e: "According to the AHA ACLS algorithm for refractory V-Fib/Pulseless V-Tach, after the 2nd shock and the 1st dose of Epinephrine, the next pharmacological step is an antiarrhythmic. Amiodarone 300 mg IV push is the first-line drug of choice (Lidocaine is an alternative if Amiodarone is unavailable)." },
    { q: "A patient is admitted with Acute Pericarditis. Which classic ECG finding is the hallmark of this condition?", o: ["ST-segment elevation in leads V1-V4 with reciprocal depression in inferior leads", "Widespread, diffuse ST-segment elevation across almost all leads and PR-segment depression", "Peaked T waves and widened QRS complexes", "Prolonged PR interval and narrow QRS complexes"], a: 1, t: "ECG Interpretation", e: "Unlike an MI, which shows ST elevation localized to the specific blocked artery (with reciprocal depression elsewhere), Acute Pericarditis causes diffuse, global inflammation of the pericardial sac. This results in widespread ST elevation in almost all leads, classically accompanied by PR segment depression." },
    { q: "A patient with heart failure is taking Digoxin and Furosemide. The patient complains of nausea, vomiting, and seeing 'yellow-green halos' around lights. The nurse suspects Digoxin toxicity. Which laboratory finding most strongly exacerbates this toxicity?", o: ["Serum Sodium of 130 mEq/L", "Serum Potassium of 2.8 mEq/L", "Serum Calcium of 10.5 mg/dL", "Serum Magnesium of 2.0 mEq/L"], a: 1, t: "Cardiac Pharmacology", e: "Digoxin binds to the Na+/K+ ATPase pump. Potassium competes with Digoxin for these binding sites. If a patient is hypokalemic (K+ 2.8, often caused by loop diuretics like Furosemide), there is no potassium to compete, allowing massive amounts of Digoxin to bind to the heart, causing profound, lethal toxicity and arrhythmias." },
    { q: "A patient with an Abdominal Aortic Aneurysm (AAA) is undergoing a routine assessment. Suddenly, the patient complains of a severe, tearing pain in the lower back and abdomen. Blood pressure drops to 70/40 mmHg, and the patient becomes diaphoretic and tachycardic. What has occurred?", o: ["The aneurysm is enlarging slowly", "Aortic Dissection in the thoracic cavity", "Rupture of the Abdominal Aortic Aneurysm", "Acute Mesenteric Ischemia"], a: 2, t: "Vascular Emergencies", e: "Sudden, excruciating, 'tearing' back or flank pain accompanied by sudden, profound hypovolemic shock (BP 70/40, tachycardia) is the classic triad of a ruptured AAA. The aorta has burst, dumping massive amounts of blood into the retroperitoneal space. This is a catastrophic surgical emergency with a very high mortality rate." },
    { q: "A 45-year-old patient presents to the ED with a hypertensive emergency (BP 240/130 mmHg). The provider orders a continuous IV infusion of Sodium Nitroprusside. The nurse must protect the IV bag with an opaque sleeve. What is the rationale for this action?", o: ["To prevent the medication from precipitating with normal saline", "To prevent light exposure, which rapidly degrades the drug into deadly cyanide", "To maintain the temperature of the medication", "To prevent the drug from binding to the plastic IV tubing"], a: 1, t: "Cardiac Pharmacology", e: "Sodium Nitroprusside is extremely photosensitive. Exposure to light rapidly degrades the molecule, rendering it ineffective and releasing toxic cyanide ions. The bag and tubing must be covered with an opaque sleeve immediately upon mixing." },
    { q: "The nurse is auscultating the heart sounds of a patient and hears a harsh, crescendo-decrescendo systolic murmur loudest at the 2nd right intercostal space, which radiates directly to the carotid arteries. What valvular defect does this indicate?", o: ["Mitral Regurgitation", "Aortic Stenosis", "Mitral Stenosis", "Aortic Regurgitation"], a: 1, t: "Valvular Heart Disease", e: "The aortic valve is auscultated at the 2nd right intercostal space. A systolic, harsh, crescendo-decrescendo murmur heard here that physically radiates up into the neck (carotids) is the classic pathognomonic presentation of Aortic Stenosis. (Mitral murmurs are heard at the apex)." },
    { q: "A patient in the ICU has a central venous catheter. The nurse is monitoring the Central Venous Pressure (CVP). Which condition would directly cause a falsely ELEVATED CVP reading?", o: ["Hypovolemia from severe hemorrhage", "Mechanical ventilation with high Positive End-Expiratory Pressure (PEEP)", "Massive systemic vasodilation from sepsis", "Administration of high-dose Nitroglycerin"], a: 1, t: "Hemodynamics", e: "CVP measures pressure in the superior vena cava/right atrium. High PEEP pushes immense pressure into the thoracic cavity. This positive intrathoracic pressure compresses the right atrium and vena cava from the outside, artificially squeezing them and causing a falsely elevated CVP reading that does not truly reflect the patient's fluid volume." },
    { q: "A patient with Infective Endocarditis is admitted. The nurse assesses the patient's hands and notes small, painful, red, raised nodules on the pads of the fingers and toes. How should the nurse document this specific finding?", o: ["Janeway lesions", "Osler's nodes", "Roth's spots", "Splinter hemorrhages"], a: 1, t: "Cardiovascular Infections", e: "Osler's nodes are painful, erythematous, raised nodules found on the pads of the fingers and toes, caused by immune complex deposition in Endocarditis. Janeway lesions are painless, flat, red spots on the palms and soles caused by microemboli. Roth's spots are retinal hemorrhages." },
    { q: "A patient is prescribed a new medication for Chronic Stable Angina. The patient has a history of severe Asthma. Which class of antianginal medication is strictly CONTRAINDICATED for this patient?", o: ["Calcium Channel Blockers (e.g., Amlodipine)", "Nitrates (e.g., Isosorbide Dinitrate)", "Non-selective Beta-Blockers (e.g., Propranolol)", "Antiplatelets (e.g., Clopidogrel)"], a: 2, t: "Cardiac Pharmacology", e: "Non-selective beta-blockers (like Propranolol, Nadolol) block both Beta-1 receptors (in the heart) and Beta-2 receptors (in the lungs). Blocking Beta-2 receptors causes severe, fatal bronchoconstriction in patients with a history of Asthma or COPD. Only cardioselective (Beta-1) blockers should be considered, if at all." },
    { q: "A patient with acute decompensated heart failure is ordered IV Nesiritide (Natrecor). The nurse understands that this drug is a synthetic form of Human B-type Natriuretic Peptide (BNP). What is its exact mechanism of action?", o: ["It massively increases the force of myocardial contraction (inotropic)", "It promotes massive diuresis, natriuresis (sodium excretion), and potent vasodilation to reduce preload and afterload", "It chemically dissolves clots in the coronary arteries", "It completely blocks the Renin-Angiotensin-Aldosterone System (RAAS)"], a: 1, t: "Cardiac Pharmacology", e: "Nesiritide is recombinant BNP. The heart naturally releases BNP when it is overstretched (fluid overload). Nesiritide acts exactly like natural BNP: it forces the kidneys to excrete sodium and water (diuresis/natriuresis) and acts as a potent smooth muscle relaxant (vasodilator), drastically lowering both preload and afterload to relieve the failing heart." },
    { q: "A patient on the telemetry unit exhibits a sudden rhythm change. There are absolutely no discernible P waves; instead, the baseline is chaotic and fibrillatory. The R-R intervals are completely irregular. The ventricular rate is 140 bpm. What is this rhythm?", o: ["Ventricular Fibrillation", "Atrial Flutter", "Atrial Fibrillation with Rapid Ventricular Response (RVR)", "Supraventricular Tachycardia (SVT)"], a: 2, t: "ECG Interpretation", e: "The hallmark of Atrial Fibrillation is an 'irregularly irregular' rhythm with completely absent P waves and a chaotic fibrillatory baseline. Because the ventricular rate is >100 bpm (140), it is specifically termed A-Fib with RVR. Ventricular fibrillation has no discernible QRS complexes." },
    { q: "A patient with an acute Aortic Dissection is admitted to the ED. Blood pressure is 220/120 mmHg, and heart rate is 115 bpm. What is the absolute FIRST pharmacological priority?", o: ["Administer IV Nitroprusside to rapidly lower blood pressure", "Administer IV Esmolol (Beta-blocker) to rapidly lower the heart rate and force of contraction (dP/dt)", "Administer IV Morphine to eliminate pain", "Administer IV Heparin to prevent clotting in the false lumen"], a: 1, t: "Vascular Emergencies", e: "In an aortic dissection, the sheer force of the heart ejecting blood (dP/dt) tears the aorta further. The absolute priority is to give an IV Beta-Blocker FIRST to blunt the heart rate and contraction force. Giving a vasodilator (like Nitroprusside) FIRST causes reflex tachycardia, which will instantly increase the sheer force and completely rupture the aorta." },
    { q: "A patient is pacing in the hall when they suddenly clutch their chest and collapse. The nurse confirms unresponsiveness and no pulse. The defibrillator is attached and shows Asystole. What is the nurse's immediate action?", o: ["Defibrillate at 200 Joules", "Initiate high-quality CPR and prepare Epinephrine 1 mg IV", "Administer Atropine 1 mg IV", "Perform synchronized cardioversion"], a: 1, t: "ACLS Protocol", e: "Asystole (flatline) and PEA (Pulseless Electrical Activity) are NON-SHOCKABLE rhythms. Defibrillation is strictly contraindicated as it will destroy any remaining pacemaking cells. The only treatment is immediate, high-quality CPR and Epinephrine 1 mg every 3-5 minutes while searching for reversible causes (H's and T's). Atropine is no longer in the ACLS Asystole algorithm." },
    { q: "A patient is prescribed Amiodarone for recurrent V-Tach. The nurse is providing discharge teaching. Which severe, life-threatening long-term side effect must the patient be taught to monitor for and report immediately?", o: ["Tardive Dyskinesia", "Pulmonary Fibrosis (new onset cough, progressive dyspnea)", "Acute Renal Failure", "Gastrointestinal Bleeding"], a: 1, t: "Cardiac Pharmacology", e: "Amiodarone is highly lipophilic and iodine-rich. It accumulates in tissues over time. The most severe, potentially fatal long-term side effect is Amiodarone-induced Pulmonary Toxicity, which leads to irreversible Pulmonary Fibrosis. Any new onset of dry cough, dyspnea, or pleuritic pain requires immediate cessation and evaluation." },
    { q: "A patient with heart failure undergoes an Echocardiogram. The Ejection Fraction (EF) is reported as 25%. How should the nurse interpret this finding?", o: ["Normal heart function", "Mild heart failure", "Severe systolic heart failure (HFrEF)", "Severe diastolic heart failure (HFpEF)"], a: 2, t: "Heart Failure", e: "A normal Ejection Fraction is 55-70%. An EF of 25% indicates severe failure of the left ventricle to pump blood out during contraction. Because the pump itself is failing to eject (systole), this is strictly defined as Severe Systolic Heart Failure, or Heart Failure with Reduced Ejection Fraction (HFrEF)." },
    { q: "A patient with suspected Pulmonary Embolism (PE) is ordered a spiral CT scan, but the patient has a severe allergy to iodine contrast. Which alternative diagnostic test is the absolute gold standard for diagnosing a PE in this patient?", o: ["D-Dimer blood test", "Ventilation-Perfusion (V/Q) Scan", "Echocardiogram", "Lower extremity venous doppler ultrasound"], a: 1, t: "Diagnostic Procedures", e: "A CT Pulmonary Angiogram (CTPA) requires iodine contrast. If the patient has a severe allergy or renal failure, the diagnostic alternative of choice is the Ventilation/Perfusion (V/Q) scan. It uses inhaled and injected radioisotopes to find areas of the lung that are ventilated but completely lack perfusion (a V/Q mismatch), diagnosing the PE." },
    { q: "A patient with a transvenous temporary pacemaker is admitted. The ECG monitor shows a pacing spike, but it is NOT followed by a P wave or QRS complex. The patient's intrinsic heart rate is 35 bpm. What is this pacemaker malfunction called, and what is the immediate intervention?", o: ["Failure to sense; turn the patient on their left side", "Failure to capture; increase the output (mA - milliamperes) until a QRS is seen", "Failure to pace; check the battery connections", "Oversensing; decrease the sensitivity threshold"], a: 1, t: "Pacemakers", e: "When a pacing spike occurs but the heart muscle fails to depolarize (no QRS), it is called 'Failure to Capture'. The electrical current is not strong enough to force the heart to beat. The immediate, life-saving intervention is to increase the electrical output (mA) on the generator until every spike results in a QRS complex." },
    { q: "A patient is admitted with Acute Pericarditis. The nurse is auscultating the chest. What classic auscultatory finding confirms this diagnosis, and how is it best heard?", o: ["A third heart sound (S3) gallop heard at the apex", "A harsh systolic murmur heard at the right sternal border", "A scratchy, grating sound (Pericardial Friction Rub) heard best at the lower left sternal border with the patient leaning forward", "A continuous machine-like murmur heard infraclavicularly"], a: 2, t: "Cardiovascular Assessment", e: "The hallmark of acute pericarditis is a Pericardial Friction Rub, caused by the inflamed layers of the pericardial sac rubbing against each other. It sounds like leathery, scratchy grating. It is best heard with the diaphragm of the stethoscope at the lower left sternal border, especially when the patient sits up, leans forward, and holds their breath in expiration." },
    { q: "A patient with a history of hypertension is prescribed Lisinopril (an ACE inhibitor). The patient presents to the ED with massive swelling of the lips, tongue, and face, stridor, and difficulty breathing. What is the pathophysiology of this catastrophic side effect?", o: ["A classic IgE-mediated anaphylactic allergic reaction", "Accumulation of Bradykinin leading to massive vasodilation and increased vascular permeability (Angioedema)", "Direct toxicity to the laryngeal nerve", "A massive buildup of Angiotensin II"], a: 1, t: "Cardiac Pharmacology", e: "ACE inhibitors block the Angiotensin-Converting Enzyme. However, this same enzyme is responsible for breaking down Bradykinin. When ACE is blocked, Bradykinin builds up massively in the tissues. Bradykinin is a potent vasodilator and increases capillary permeability, leading to fluid leaking into the face/throat (Angioedema), a fatal airway emergency." },
    { q: "A 55-year-old male is recovering from a myocardial infarction. The provider prescribes Clopidogrel (Plavix) to be taken alongside Aspirin. What is the explicit mechanism of action of Clopidogrel?", o: ["It dissolves the fibrin mesh of existing clots", "It irreversibly blocks the P2Y12 ADP receptors on the platelet surface, preventing platelet aggregation", "It inhibits the synthesis of Vitamin K-dependent clotting factors in the liver", "It binds to antithrombin III, inactivating Thrombin and Factor Xa"], a: 1, t: "Cardiac Pharmacology", e: "Clopidogrel is an antiplatelet medication (a thienopyridine). It permanently binds to the P2Y12 adenosine diphosphate (ADP) receptors on the outside of platelets. This prevents the platelets from receiving the signal to become sticky and clump together (aggregation), preventing stent thrombosis and future MIs." },
    { q: "A patient with severe symptomatic bradycardia (HR 32 bpm) is given IV Atropine, but there is no response. The patient's BP is 75/40, and they are becoming confused. According to ACLS guidelines, what is the NEXT immediate intervention?", o: ["Administer Epinephrine 1 mg IV push", "Prepare for Transcutaneous Pacing (TCP)", "Administer IV Amiodarone", "Perform Unsynchronized Defibrillation"], a: 1, t: "ACLS Protocol", e: "For unstable bradycardia refractory to Atropine (or if Atropine is ineffective, such as in high-degree AV blocks or heart transplants), the immediate next step is Transcutaneous Pacing (TCP) or initiating a continuous infusion of a chronotropic drug (Dopamine or Epinephrine infusion). Epinephrine 1mg IV push is for cardiac arrest, not a perfusing bradycardia." },
    { q: "A patient is admitted with infective endocarditis affecting the Tricuspid valve. Due to the anatomical location of this valve, the nurse must meticulously monitor the patient for which specific type of embolic complication?", o: ["Ischemic Stroke (CVA)", "Acute Myocardial Infarction", "Pulmonary Embolism (PE)", "Renal artery infarction"], a: 2, t: "Cardiovascular Pathophysiology", e: "The tricuspid valve is on the RIGHT side of the heart. If vegetations (clumps of bacteria/fibrin) break off from the tricuspid valve, they travel directly out the pulmonary artery and lodge strictly in the lungs, causing Pulmonary Embolisms. Left-sided endocarditis (Mitral/Aortic) causes systemic emboli (strokes, renal, splenic)." },
    { q: "A patient with heart failure is receiving a Dobutamine infusion. What is the precise, primary intended effect of this medication on the heart?", o: ["Potent peripheral vasodilation to drastically reduce afterload", "Decreasing the heart rate to allow for better diastolic filling time", "Strong Beta-1 agonism leading to a massive increase in myocardial contractility (Positive Inotrope)", "Direct chemical suppression of ventricular arrhythmias"], a: 2, t: "Cardiac Pharmacology", e: "Dobutamine is a synthetic catecholamine and a highly selective Beta-1 agonist. Its primary action is to drastically increase the force of myocardial contraction (a positive inotrope), which increases stroke volume and cardiac output in severe heart failure or cardiogenic shock. It has mild vasodilatory effects, but its primary role is inotropic." },
    { q: "A 12-lead ECG reveals a normal PR interval, but the QRS complex is massively widened to 0.16 seconds, and there is an 'RSR' (rabbit ear) pattern in leads V1 and V2. What is the specific diagnosis?", o: ["Left Bundle Branch Block (LBBB)", "Right Bundle Branch Block (RBBB)", "Third-Degree AV Block", "Wolf-Parkinson-White (WPW) Syndrome"], a: 1, t: "ECG Interpretation", e: "A QRS > 0.12 seconds indicates a bundle branch block. The 'RSR' (rabbit ear) pattern in the right-sided precordial leads (V1 and V2) is the absolute hallmark of a Right Bundle Branch Block (RBBB). A Left Bundle Branch Block (LBBB) would show deep, broad S waves in V1 and broad R waves in V6." },
    { q: "A patient presents with a suspected deep vein thrombosis (DVT) in the left leg. The nurse notes the leg is swollen, warm, and red. Which physical assessment maneuver is historically associated with DVT but is now considered DANGEROUS and strongly discouraged?", o: ["Checking pedal pulses", "Homan's sign (forceful dorsiflexion of the foot to elicit calf pain)", "Measuring calf circumference", "Palpating the femoral artery"], a: 1, t: "Cardiovascular Assessment", e: "Homan's sign was historically used to test for a DVT. However, forcefully dorsiflexing the foot can physically squeeze the calf muscles against the deep veins, breaking the clot loose and instantly causing a fatal Pulmonary Embolism. It is highly unreliable and explicitly contraindicated in modern practice." },
    { q: "A patient is prescribed Spironolactone (Aldactone) for severe heart failure. The patient asks why they are taking this drug instead of Furosemide (Lasix). The nurse explains that Spironolactone specifically:", o: ["Is the most powerful, rapid-acting diuretic available", "Blocks Aldosterone, preventing cardiac remodeling/fibrosis and retaining potassium", "Directly increases the pumping force of the heart", "Dissolves fluid entirely in the lungs"], a: 1, t: "Cardiac Pharmacology", e: "While Furosemide is a stronger diuretic, Spironolactone is a Potassium-Sparing Diuretic that specifically blocks Aldosterone. In heart failure, massive aldosterone release causes severe cardiac fibrosis, remodeling, and stiffness. Blocking aldosterone drastically improves long-term survival in heart failure patients by stopping this structural damage." },
    { q: "A patient with a history of IV drug use is admitted with right-sided infective endocarditis. The patient suddenly complains of sharp, stabbing chest pain that worsens on inspiration, dyspnea, and coughing up blood (hemoptysis). What has likely occurred?", o: ["A chunk of the heart valve vegetation has broken off and caused a Pulmonary Embolism", "The patient is having an acute Myocardial Infarction", "The patient has developed spontaneous pneumothorax", "The endocarditis has spread to the pericardium causing cardiac tamponade"], a: 0, t: "Cardiovascular Complications", e: "Right-sided endocarditis (tricuspid/pulmonic valves), common in IV drug users, produces vegetations that break off and travel straight into the pulmonary circulation. Sharp, pleuritic chest pain, dyspnea, and hemoptysis are the classic triad of a Pulmonary Embolism causing pulmonary infarction." },
    { q: "A patient is admitted with Acute Arterial Occlusion of the right leg (a blood clot in the femoral artery). The nurse assesses the limb using the '6 Ps'. Which of the following is NOT one of the 6 Ps of acute arterial ischemia?", o: ["Pain", "Pallor", "Pulselessness", "Purpura"], a: 3, t: "Vascular Assessment", e: "The 6 P's of acute arterial occlusion are Pain, Pallor (paleness), Pulselessness, Paresthesia (numbness/tingling), Paralysis, and Poikilothermia (coolness to the touch). Purpura (purple spots from bleeding under the skin) is not one of them." },
    { q: "A patient has a temporary transvenous pacemaker. The nurse observes that every pacing spike is perfectly followed by a wide QRS complex, but the patient's blood pressure is 60/40 mmHg and they have no palpable pulse. What is the diagnosis?", o: ["Failure to Capture", "Pulseless Electrical Activity (PEA)", "Failure to Sense", "Ventricular Tachycardia"], a: 1, t: "ACLS / Pacemakers", e: "The pacemaker is working perfectly electrically (spike followed by a QRS = 100% capture). However, the heart MUSCLE is too damaged or empty (e.g., massive MI, hypovolemia, tamponade) to physically contract in response to the electricity. Organized electrical activity without a pulse is Pulseless Electrical Activity (PEA). Immediate CPR is required." },
    { q: "A patient with severe hypertension is prescribed Clonidine (Catapres). The nurse must provide extreme emphasis on which discharge instruction?", o: ["'Take this medication with a large glass of grapefruit juice.'", "'Never stop this medication abruptly, as it will cause a deadly rebound hypertensive crisis.'", "'This medication will turn your urine orange, which is normal.'", "'You must have your blood drawn weekly to check white blood cell counts.'"], a: 1, t: "Cardiac Pharmacology", e: "Clonidine is a centrally acting alpha-2 agonist. It suppresses sympathetic outflow from the brain. If stopped abruptly, the brain unleashes a massive, unchecked surge of sympathetic catecholamines, causing a terrifying, life-threatening rebound hypertensive crisis. Tapering is absolutely mandatory." },
    { q: "A patient with an acute ST-Elevation Myocardial Infarction (STEMI) receives tPA (Alteplase) because a cath lab is unavailable. Which clinical finding is the BEST indicator that the reperfusion therapy was completely SUCCESSFUL?", o: ["The patient's heart rate drops to 60 bpm", "The ST-segment elevation returns to baseline (resolves) completely and the chest pain disappears", "The patient develops profound, continuous ventricular tachycardia", "The Troponin levels instantly return to normal"], a: 1, t: "Acute Coronary Syndrome", e: "The goal of tPA is to dissolve the clot in the coronary artery. The absolute best clinical markers of successful reperfusion are the abrupt cessation of chest pain and the rapid, complete resolution of the ST-segment elevation on the ECG. (Note: Transient 'reperfusion arrhythmias' like brief PVCs or accelerated idioventricular rhythm are also normal signs of success, but continuous V-Tach is lethal)." },
    { q: "A patient is admitted with a diagnosis of Dilated Cardiomyopathy. The nurse understands the exact pathophysiology of this condition involves:", o: ["Massive thickening of the ventricular walls, reducing the chamber size", "Replacement of normal heart muscle with rigid, stiff scar tissue", "Profound dilation and thinning of the ventricles, leading to a weak, floppy heart and severe systolic dysfunction", "Inflammation of the pericardial sac squeezing the heart"], a: 2, t: "Cardiomyopathy", e: "In Dilated Cardiomyopathy, the heart chambers balloon out, and the walls become incredibly thin, stretched, and weak. This leads to a massive failure of contractility (systolic dysfunction/HFrEF) because the floppy muscle cannot squeeze blood out effectively. (Thickening = Hypertrophic; Stiff = Restrictive)." },
    { q: "A patient with Mitral Stenosis is at high risk for which specific complication due to the altered hemodynamics of this defect?", o: ["Aortic Aneurysm", "Right Ventricular Hypertrophy and Pulmonary Hypertension", "Left Ventricular Hypertrophy", "Pulmonary Embolism"], a: 1, t: "Valvular Heart Disease", e: "Mitral stenosis blocks blood flow from the left atrium into the left ventricle. Blood massively backs up into the left atrium, then into the pulmonary veins, and into the lungs, causing Pulmonary Hypertension. The right ventricle must pump against this massive lung pressure, leading to Right Ventricular Hypertrophy and Cor Pulmonale. The left ventricle actually shrinks because it gets no blood." },
    { q: "A patient is receiving a continuous IV infusion of Heparin. The aPTT is 180 seconds (Control is 30 seconds), and the patient is bleeding heavily from their gums. What is the nurse's immediate sequence of actions?", o: ["Administer Vitamin K, stop the Heparin, draw a PT/INR", "Stop the Heparin infusion, notify the provider, and prepare to administer Protamine Sulfate", "Decrease the Heparin rate by half and reassess in 4 hours", "Administer Fresh Frozen Plasma (FFP) and Platelets"], a: 1, t: "Cardiac Pharmacology", e: "The aPTT is dangerously high (therapeutic is 1.5 - 2.5 times control, so roughly 45-75 seconds). At 180 seconds with active bleeding, the patient is highly toxic. The nurse must STOP the infusion immediately. The direct, specific antidote for Heparin is Protamine Sulfate." },
    { q: "A patient with peripheral arterial disease (PAD) is discharged. Which instruction is absolutely CONTRAINDICATED for this patient?", o: ["'Keep your legs in a dependent (hanging down) position to improve blood flow.'", "'Apply heating pads directly to your calves at night to increase circulation.'", "'Stop smoking entirely.'", "'Walk every day until it hurts, rest, and then walk again.'"], a: 1, t: "Peripheral Vascular Disease", e: "PAD causes severe ischemia and numbness (neuropathy) in the legs. Applying direct heat (like a heating pad) is absolutely contraindicated. Because they lack sensation, they will easily suffer severe third-degree burns without feeling it. Furthermore, the heat drastically increases the metabolic demand of tissues that are already starved of oxygen." },
    { q: "A patient undergoes a coronary angiogram via the right femoral artery. 30 minutes post-procedure, the patient complains of sudden, severe right flank and lower back pain. The BP drops to 85/50, and HR is 120. The femoral site looks clean with no visible bleeding. What is the hidden catastrophe?", o: ["Acute Renal Failure from contrast dye", "Retroperitoneal Hemorrhage", "Aortic Dissection", "Vagal Response to pain"], a: 1, t: "Post-Cath Complications", e: "The femoral artery was punctured during the cath. If it leaks internally, the blood tracks backward up into the retroperitoneal space. This massive internal bleed is invisible from the outside. Classic signs are sudden severe back/flank pain, shock (hypotension, tachycardia), and later, Cullen's or Grey Turner's signs. This is a life-threatening emergency requiring immediate manual pressure above the site and surgical intervention." },
    { q: "A patient's ECG shows a regular rhythm. The P waves and QRS complexes are completely dissociated; they beat at their own entirely separate rates (Atria at 80, Ventricles at 40). What is the exact diagnosis?", o: ["First-Degree AV Block", "Second-Degree AV Block Type 1 (Wenckebach)", "Second-Degree AV Block Type 2 (Mobitz II)", "Third-Degree (Complete) AV Block"], a: 3, t: "ECG Interpretation", e: "In a Third-Degree (Complete) AV Block, the electrical connection between the top and bottom of the heart is completely severed. The SA node fires the atria (P waves) at 80 bpm, and the ventricles resort to their own backup escape pacemaker (QRS) firing slowly at 20-40 bpm. There is zero relationship between the P waves and QRS complexes (AV Dissociation). Pacemaker is required." },
    { q: "A patient is prescribed Ticagrelor (Brilinta) after a stent placement. The nurse knows this medication belongs to which specific class?", o: ["Direct Oral Anticoagulant (DOAC)", "Thrombolytic", "P2Y12 Platelet Inhibitor", "Glycoprotein IIb/IIIa Inhibitor"], a: 2, t: "Cardiac Pharmacology", e: "Ticagrelor, like Clopidogrel and Prasugrel, is a P2Y12 receptor antagonist (antiplatelet drug). It prevents platelets from aggregating and clotting off the newly placed coronary stent. Unlike Clopidogrel, Ticagrelor is a reversible inhibitor, but it works faster and stronger." },
    { q: "A patient is in the ICU with severe cardiogenic shock. The provider orders a Milrinone (Primacor) infusion. What is the dual mechanism of action of this phosphodiesterase inhibitor?", o: ["It massively increases heart rate and heavily vasoconstricts the periphery", "It is a positive inotrope (increases contractility) and a potent vasodilator (decreases afterload)", "It slows the heart rate and dilates the coronary arteries", "It paralyzes the heart to allow for prolonged diastolic filling"], a: 1, t: "Cardiac Pharmacology", e: "Milrinone is a phosphodiesterase-3 (PDE3) inhibitor. By preventing the breakdown of cAMP in the heart and blood vessels, it acts as an 'Inodilator'. It massively increases the force of myocardial contraction (inotropic) while simultaneously causing potent vasodilation, drastically dropping afterload so the failing heart can pump easier." },
    { q: "A patient presents with a deep vein thrombosis (DVT). The provider initiates Enoxaparin (Lovenox) subcutaneous injections. Which laboratory test must be monitored specifically to adjust the dose of Enoxaparin?", o: ["PT/INR", "aPTT", "Bleeding Time", "Routine lab monitoring for dose adjustment is not required for Enoxaparin"], a: 3, t: "Cardiac Pharmacology", e: "Unlike unfractionated IV Heparin (which requires strict, continuous aPTT monitoring), Enoxaparin is a Low-Molecular-Weight Heparin (LMWH). It has a highly predictable dose-response curve based purely on patient weight. Therefore, routine lab monitoring (aPTT) to adjust the dose is NOT required. (Platelets must be checked for HIT, but not for dosing)." },
    { q: "A patient with Endocarditis has a sudden onset of left-sided paralysis, facial droop, and expressive aphasia. The nurse suspects an embolic stroke. Given the symptoms, the vegetation likely broke off from which specific heart valve?", o: ["Tricuspid Valve", "Pulmonary Valve", "Mitral or Aortic Valve", "Eustachian Valve"], a: 2, t: "Cardiovascular Pathophysiology", e: "Left-sided paralysis and aphasia indicate a massive stroke in the brain (systemic circulation). The left side of the heart (Mitral and Aortic valves) pumps blood to the brain and body. If a vegetation breaks off from the Mitral or Aortic valve, it shoots straight up the carotid arteries into the brain, causing an embolic ischemic stroke." },
    { q: "A patient is diagnosed with Wolff-Parkinson-White (WPW) syndrome. The nurse looks at the ECG and expects to find a short PR interval and a slurred upstroke of the QRS complex. What is this specific slurred wave called?", o: ["J wave (Osborn wave)", "Delta wave", "Epsilon wave", "U wave"], a: 1, t: "ECG Interpretation", e: "WPW syndrome involves a congenital accessory electrical pathway (Bundle of Kent) that bypasses the AV node. The electrical impulse hits the ventricles too early, causing a short PR interval and a slurred, slanted start to the QRS complex, universally known as the Delta wave." },
    { q: "A patient with heart failure is receiving Furosemide (Lasix). The patient's urine output has been 3 liters in the past 12 hours. The ECG monitor suddenly shows frequent Premature Ventricular Contractions (PVCs) and a flattened T wave. What is the absolute priority action?", o: ["Administer IV Amiodarone to suppress the PVCs", "Check the patient's serum Potassium level and notify the provider", "Increase the Furosemide dose to clear the remaining fluid", "Administer sublingual Nitroglycerin"], a: 1, t: "Electrolytes / ECG", e: "Furosemide is a potassium-wasting loop diuretic. Massive diuresis (3L) violently flushes potassium out of the body. Severe hypokalemia causes myocardial irritability (frequent PVCs) and classic ECG changes (flattened T waves, U waves). Replacing the potassium immediately is critical to prevent the PVCs from degrading into Ventricular Tachycardia or V-Fib." },
    { q: "A patient is undergoing CPR for Ventricular Fibrillation. The team is preparing to administer the first dose of Amiodarone. According to ACLS guidelines, what is the exact correct initial dose and route?", o: ["150 mg IV push", "300 mg IV push", "150 mg infused over 10 minutes", "1 mg IV push"], a: 1, t: "ACLS Protocol", e: "In the Cardiac Arrest algorithm (Pulseless V-Tach / V-Fib), the initial dose of Amiodarone is a rapid 300 mg IV push. (If the patient was STABLE with a pulse, you would give 150 mg infused slowly over 10 minutes). If a second dose is needed in cardiac arrest, it is 150 mg IV push." },
    { q: "A patient with a history of rheumatic fever presents with shortness of breath, a loud 'snapping' first heart sound (S1), and a low-pitched diastolic rumble at the apex. The patient frequently coughs up blood-tinged sputum. Diagnosis?", o: ["Aortic Stenosis", "Mitral Regurgitation", "Mitral Stenosis", "Aortic Regurgitation"], a: 2, t: "Valvular Heart Disease", e: "Rheumatic fever classically scars and fuses the mitral valve. Mitral Stenosis creates a tight funnel between the left atrium and ventricle. When the valve finally forces open during diastole, it 'snaps' loudly (opening snap). Blood struggles through the tight hole, causing a low-pitched diastolic rumble at the apex. The backup of blood destroys pulmonary capillaries, causing hemoptysis." },
    { q: "A 22-year-old athlete collapses on the field and dies suddenly. Autopsy reveals a massively thickened, asymmetrical interventricular septum that obstructed the aortic outflow tract during intense exercise. What is this exact genetic condition?", o: ["Dilated Cardiomyopathy", "Hypertrophic Obstructive Cardiomyopathy (HOCM)", "Restrictive Cardiomyopathy", "Arrhythmogenic Right Ventricular Dysplasia (ARVD)"], a: 1, t: "Cardiomyopathy", e: "HOCM is a genetic defect causing massive, asymmetrical thickening of the heart muscle, especially the septum. During intense exercise, the heart pumps so hard that the thick septum physically slams against the mitral valve leaflet, instantly blocking blood from leaving the heart (outflow tract obstruction), causing sudden cardiac death in young athletes." },
    { q: "A patient receives a heart transplant. The nurse knows that because the donor heart is completely denervated (all nerve connections cut), the patient will NOT experience which classic symptom during a future Myocardial Infarction?", o: ["Shortness of breath", "Chest pain (Angina)", "Fatigue", "Nausea"], a: 1, t: "Advanced Cardiology", e: "During a heart transplant, the vagus and sympathetic nerves are permanently severed. Because there are absolutely no pain nerves connecting the new heart to the brain, the patient will never feel chest pain (angina) if they have a heart attack. They will present atypically with sudden shortness of breath, fatigue, or arrhythmias." },
    { q: "A patient with severe shock is receiving a continuous infusion of Dopamine at 15 mcg/kg/min. At this high dose, which receptor is primarily stimulated, and what is the specific physiological effect?", o: ["Dopaminergic receptors; massive renal vasodilation", "Beta-1 receptors; increased heart rate and contractility", "Alpha-1 receptors; profound systemic vasoconstriction to raise blood pressure", "Beta-2 receptors; profound bronchodilation"], a: 2, t: "Cardiac Pharmacology", e: "Dopamine is dose-dependent. At low doses (1-3 mcg), it hits dopaminergic receptors (renal dilation). At medium doses (5-10 mcg), it hits Beta-1 receptors (increases contractility). At HIGH doses (>10-20 mcg/kg/min), it acts almost exclusively on Alpha-1 receptors, causing massive, profound systemic vasoconstriction to drive up blood pressure in severe shock." },
    { q: "A patient with a central line develops a massive Air Embolism. The nurse instantly places the patient in the left lateral Trendelenburg position. What is the exact anatomical rationale for this highly specific position?", o: ["It forces the air bubble to dissolve rapidly in the bloodstream", "It traps the air bubble in the apex of the right ventricle, preventing it from being pumped into the pulmonary artery", "It forces the air bubble out of the right atrium back up into the jugular vein", "It prevents the air from crossing the blood-brain barrier"], a: 1, t: "Emergencies", e: "Air is lighter than blood. Placing the patient head-down (Trendelenburg) and on their Left Side turns the Right Ventricle 'upside down'. The air bubble floats to the very top (the apex) of the right ventricle and stays trapped there, safely away from the pulmonary valve. This prevents the heart from pumping the fatal air lock into the lungs." },
    { q: "A patient presents with crushing chest pain. The ECG shows ST elevation. Before administering Aspirin, Nitroglycerin, and Morphine, the provider orders Ticagrelor (Brilinta) 180 mg PO stat. The patient asks why they need such a huge dose of this pill. The nurse explains:", o: ["'It is a loading dose designed to instantly and completely shut down your platelets to stop the heart attack.'", "'This dose will dissolve the clot currently in your heart.'", "'It protects your stomach from the Aspirin.'", "'It lowers your heart rate to stop the chest pain.'"], a: 0, t: "Cardiac Pharmacology", e: "Ticagrelor is a potent P2Y12 antiplatelet. In an acute STEMI, a massive 'loading dose' (180 mg, normal daily dose is 90 mg BID) is given to instantly achieve maximum platelet inhibition, paralyzing the platelets immediately to stop the clot from growing while rushing the patient to the cath lab." },
    { q: "A patient undergoes a Transesophageal Echocardiogram (TEE) to check for clots before cardioverting Atrial Fibrillation. Post-procedure, the patient is incredibly thirsty and asks for a drink of water. What is the nurse's mandatory FIRST action?", o: ["Check the patient's blood pressure and heart rate", "Assess the return of the gag reflex using a tongue depressor", "Offer a small ice chip first to see if they tolerate it", "Auscultate bowel sounds"], a: 1, t: "Diagnostic Procedures", e: "During a TEE, a massive ultrasound probe is passed down the esophagus. The throat is heavily sprayed with local anesthetics (lidocaine/benzocaine) to paralyze the gag reflex. If given water before the reflex returns, the patient will silently aspirate directly into the lungs. The nurse MUST physically test the gag reflex with a tongue blade before ANY PO intake." },
    { q: "A patient with severe, crushing chest pain arrives at the ED. The 12-lead ECG is completely NORMAL. However, the initial high-sensitivity Troponin I level is massively elevated. What is the exact diagnosis?", o: ["STEMI (ST-Elevation Myocardial Infarction)", "NSTEMI (Non-ST Elevation Myocardial Infarction)", "Unstable Angina", "Stable Angina"], a: 1, t: "Acute Coronary Syndrome", e: "A normal (or non-specific) ECG combined with a positive, elevated Troponin means the heart muscle is actively dying, but the blockage is incomplete or involves deep tissue not perfectly captured by the surface ECG. This is the exact definition of a Non-ST Elevation Myocardial Infarction (NSTEMI). Unstable angina has NO troponin leak." },
    { q: "A patient with a history of IV drug abuse develops Infective Endocarditis of the Tricuspid valve. The provider orders Vancomycin and Gentamicin IV. The nurse must monitor which two critical laboratory values daily to prevent catastrophic toxicity from this specific antibiotic combination?", o: ["AST/ALT (Liver enzymes)", "BUN and Creatinine (Renal function)", "Absolute Neutrophil Count (ANC)", "PT and INR"], a: 1, t: "Cardiac Pharmacology", e: "Both Vancomycin and Gentamicin (an aminoglycoside) are notoriously highly NEPHROTOXIC and OTOTOXIC. When combined to treat severe endocarditis, they act synergistically to destroy the kidneys. Daily monitoring of BUN, Creatinine, and peak/trough drug levels is absolutely mandatory to prevent permanent Acute Renal Failure." },
    { q: "A patient is admitted with a massive Acute Pulmonary Embolism. The patient's BP is 60/40 mmHg, and they are cyanotic. The provider orders IV Alteplase (tPA). What is the exact mechanism of action of Alteplase in this life-threatening emergency?", o: ["It instantly stops the platelets from clumping to the PE", "It turns off the coagulation cascade in the liver", "It binds to fibrin and converts plasminogen into active plasmin, violently shredding and dissolving the existing clot", "It paralyzes the lungs to decrease oxygen demand"], a: 2, t: "Cardiac Pharmacology", e: "Alteplase is a thrombolytic (clot-buster). Unlike Heparin (which just prevents clots from growing), tPA actively attacks the clot. It binds directly to the fibrin mesh and unleashes plasmin, which violently rips the clot apart molecule by molecule, instantly restoring blood flow to the lungs and saving the patient's life." }
];

let currentQ = 0;
let score = 0;
let answeredCount = 0;
let answersData = new Array(questions.length).fill(null);

const quizBody = document.getElementById('quiz-body');
const scoreEl = document.getElementById('score');
const qCounterEl = document.getElementById('q-counter');
const progressEl = document.getElementById('progress');

function initQuiz() {
    questions.forEach((q, index) => {
        const qDiv = document.createElement('div');
        qDiv.className = `question-container ${index === 0 ? 'active' : ''}`;
        qDiv.id = `question-${index}`;
        
        qDiv.innerHTML = `
            <div class="subject-tag">${q.t}</div>
            <div class="q-text">Q${index + 1}: ${q.q}</div>
            <div class="options" id="options-${index}">
                ${q.o.map((opt, optIndex) => `
                    <button class="option-btn" onclick="checkAnswer(${index},${optIndex}, this)">
                        ${String.fromCharCode(65 + optIndex)}.${opt}
                    </button>
                `).join('')}
            </div>
            <div class="rationale" id="rationale-${index}">
                <strong>Clinical Rationale:</strong> ${q.e}
            </div>
            <div class="navigation">
                <button class="nav-btn" onclick="changeQuestion(-1)" ${index === 0 ? 'disabled' : ''}>Previous</button>
                <button class="nav-btn" onclick="changeQuestion(1)">${index === questions.length - 1 ? 'Submit Exam' : 'Next Question'}</button>
            </div>
        `;
        quizBody.appendChild(qDiv);
    });
    updateProgress();
}

function checkAnswer(qIndex, selectedOptIndex, btnElement) {
    if (answersData[qIndex] !== null) return; 
    
    const optionsContainer = document.getElementById(`options-${qIndex}`);
    const buttons = optionsContainer.querySelectorAll('.option-btn');
    const correctIndex = questions[qIndex].a;
    const rationaleBox = document.getElementById(`rationale-${qIndex}`);

    answersData[qIndex] = selectedOptIndex;
    buttons.forEach(btn => btn.classList.add('disabled'));

    if (selectedOptIndex === correctIndex) {
        btnElement.classList.add('correct');
        score += 1;
    } else {
        btnElement.classList.add('incorrect');
        buttons[correctIndex].classList.add('correct'); 
        score -= 0.3333; 
    }
    
    rationaleBox.style.display = 'block';
    answeredCount++;
    scoreEl.innerText = score.toFixed(2);
}

function changeQuestion(direction) {
    if (direction === 1 && currentQ === questions.length - 1) {
        finishExam();
        return;
    }
    
    document.getElementById(`question-${currentQ}`).classList.remove('active');
    currentQ += direction;
    document.getElementById(`question-${currentQ}`).classList.add('active');
    
    qCounterEl.innerText = `Question: ${currentQ + 1} / 100`;
    updateProgress();
    window.scrollTo(0, 0);
}

function updateProgress() {
    const percent = ((currentQ + 1) / questions.length) * 100;
    progressEl.style.width = `${percent}%`;
}

function finishExam() {
    let unattempted = questions.length - answeredCount;
    if(unattempted > 0) {
        let confirmFinish = confirm(`WARNING: You have ${unattempted} unattempted questions. Submit anyway?`);
        if(!confirmFinish) return;
    }

    quizBody.style.display = 'none';
    document.querySelector('.dashboard').style.display = 'none';
    document.querySelector('.progress-bar').style.display = 'none';
    document.getElementById('results-screen').style.display = 'block';
    
    let finalScoreFormatted = score < 0 ? "0.00" : score.toFixed(2);
    document.getElementById('final-score-display').innerText = `${finalScoreFormatted} / 100`;
}

window.onload = initQuiz;
</script>

</body>
</html>
